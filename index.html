<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tu entrenamiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2F2B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Running">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
<!-- no guardar en caché la pantalla de acceso -->
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<style>
@font-face{font-family:'Bricolage';src:url('fonts/bricolage.woff2') format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'Hanken';src:url('fonts/hanken.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--pine:#0E2F2B;--run:#F5B300;--display:'Bricolage',system-ui,sans-serif;--sans:'Hanken',system-ui,sans-serif;--r-sm:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--pine)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:#EAF4F1}
.screen{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));background:var(--pine);position:relative;overflow:hidden}
.screen::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% 115%,transparent 0 34px,rgba(255,255,255,.055) 34px 35px);pointer-events:none}
.hidden{display:none!important}
.box{position:relative;width:100%;max-width:380px}
.mark{display:block;margin-bottom:28px}
.title{font-family:var(--display);font-size:40px;line-height:1.02;font-weight:700;letter-spacing:-.025em;margin-bottom:10px}
.sub{color:#A9C2BC;margin-bottom:28px;font-size:16px;line-height:1.45}
.field{position:relative}
.field input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:var(--r-sm);padding:14px 56px 14px 16px;color:#fff;font-size:17px;min-height:52px;font-family:var(--sans);outline:none;letter-spacing:.04em}
.field input::placeholder{color:#8FA9A3;letter-spacing:0}
.field input:focus{border-color:var(--run);box-shadow:0 0 0 4px rgba(245,179,0,.2)}
.eye{position:absolute;right:4px;top:4px;width:44px;height:44px;display:grid;place-items:center;border:none;background:none;color:#A9C2BC;cursor:pointer;border-radius:10px}
.eye:focus-visible{outline:2px solid var(--run)}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.remember{display:flex;align-items:center;gap:12px;margin-top:16px;min-height:44px;color:#D3E2DE;font-size:15px;cursor:pointer;user-select:none}
.remember input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border:1.5px solid rgba(255,255,255,.35);border-radius:7px;background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer}
.remember input:checked{background:var(--run);border-color:var(--run)}
.remember input:checked::after{content:'';width:6px;height:11px;border:solid #2B1E00;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.remember input:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.go{width:100%;margin-top:14px;background:var(--run);border:none;border-radius:var(--r-sm);min-height:52px;color:#2B1E00;font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer}
.go:active{transform:scale(.985)}
.go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.go[disabled]{opacity:.7;cursor:progress}
.error{font-size:14px;color:#FFB4B7;margin-top:12px;min-height:20px}
.loading{display:grid;place-items:center;min-height:100vh;min-height:100dvh;background:var(--pine)}
.loading svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loading svg{animation:none}}
</style>
</head>
<body>
<div id="staticrypt_loading" class="loading" aria-label="Cargando">
  <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-width="6" stroke-linecap="round"><path d="M32 6a26 26 0 0 1 24.7 18" stroke="#F5B300"/><path d="M58 32a26 26 0 0 1-8 18.8" stroke="#9A8FFF"/><path d="M43 55.5a26 26 0 0 1-22 0" stroke="#F5B300"/><path d="M13.3 50.8A26 26 0 0 1 6 32" stroke="rgba(255,255,255,.25)"/><path d="M7.3 24A26 26 0 0 1 26 6.6" stroke="rgba(255,255,255,.25)"/></g></svg>
</div>

<main id="staticrypt_content" class="screen hidden">
  <div class="box">
    <svg class="mark" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-width="6" stroke-linecap="round"><path d="M32 6a26 26 0 0 1 24.7 18" stroke="#F5B300"/><path d="M58 32a26 26 0 0 1-8 18.8" stroke="#9A8FFF"/><path d="M43 55.5a26 26 0 0 1-22 0" stroke="#F5B300"/><path d="M13.3 50.8A26 26 0 0 1 6 32" stroke="rgba(255,255,255,.25)"/><path d="M7.3 24A26 26 0 0 1 26 6.6" stroke="rgba(255,255,255,.25)"/></g></svg>
    <h1 class="title">Tu entrenamiento, semana a semana</h1>
    <p class="sub">Introduce tu contraseña para entrar.</p>

    <form id="staticrypt-form" action="#" method="post" novalidate>
      <div class="field">
        <input id="staticrypt-password" type="password" name="password" aria-label="Contraseña" autocomplete="current-password" placeholder="Contraseña" autofocus>
        <button type="button" class="eye" id="toggle-pwd" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="eye-path" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle id="eye-dot" cx="12" cy="12" r="3"/><path id="eye-slash" d="M3 3l18 18"/></svg>
        </button>
      </div>

      <label id="staticrypt-remember-label" class="remember hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember" checked>
        Recordarme en este dispositivo
      </label>

      <button type="submit" class="go" id="go">Entrar</button>
      <p class="error" id="pwd-error" role="alert" aria-live="assertive"></p>
    </form>
  </div>
</main>
