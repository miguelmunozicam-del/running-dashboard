<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Dashboard — Miguel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#f7f8fa;--bg2:#fff;--bg3:#f0f2f5;--bg4:#e8eaed;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);--text:#1a1d23;--text2:#5c6370;--text3:#9aa0ad;--blue:#2563eb;--blue-dim:#eff4ff;--blue-bdr:#bfcffe;--green:#16a34a;--green-dim:#f0fdf4;--green-bdr:#bbf7d0;--amber:#d97706;--amber-dim:#fffbeb;--amber-bdr:#fde68a;--coral:#dc2626;--coral-dim:#fef2f2;--coral-bdr:#fecaca;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;--radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--bg2);border:0.5px solid var(--border2);border-radius:14px;padding:40px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.login-logo{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:8px}
.login-logo::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green)}
.login-title{font-size:22px;font-weight:600;margin-bottom:6px}.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-box input{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:var(--mono);outline:none}
.login-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.login-box button{width:100%;margin-top:12px;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:10px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--sans)}
.login-box button:hover{opacity:.88}.login-error{font-size:12px;color:var(--coral);margin-top:8px;display:none}
#app{display:none}
.topbar{background:var(--bg2);border-bottom:0.5px solid var(--border2);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:10}
.topbar-logo{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.topbar-logo::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)}
.topbar-title{font-size:14px;font-weight:500;margin-left:14px}.last-update{font-size:11px;color:var(--text3);font-family:var(--mono)}
.logout-btn{font-size:11px;color:var(--text2);background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer}
.main{padding:24px;max-width:1100px;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:4px;width:fit-content;box-shadow:var(--shadow);flex-wrap:wrap}
.tab-btn{font-size:13px;padding:7px 14px;background:transparent;border:none;color:var(--text2);cursor:pointer;border-radius:7px;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--blue);color:#fff;font-weight:500}.tab-btn:hover:not(.active){background:var(--bg3)}
.tab-content{display:none}.tab-content.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.metric-card{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.metric-card.accent-blue{background:var(--blue-dim);border-color:var(--blue-bdr)}.metric-card.accent-green{background:var(--green-dim);border-color:var(--green-bdr)}
.metric-card.accent-amber{background:var(--amber-dim);border-color:var(--amber-bdr)}.metric-card.accent-coral{background:var(--coral-dim);border-color:var(--coral-bdr)}
.metric-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-family:var(--mono)}
.metric-val{font-size:22px;font-weight:600;font-family:var(--mono)}.metric-val.blue{color:var(--blue)}.metric-val.green{color:var(--green)}.metric-val.amber{color:var(--amber)}.metric-val.coral{color:var(--coral)}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}
.section-label{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;font-family:var(--mono);margin:28px 0 14px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.day-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;min-height:90px;box-shadow:var(--shadow);cursor:pointer}
.day-card.done{border-color:var(--green-bdr);background:var(--green-dim)}.day-card.modified{border-color:var(--amber-bdr);background:var(--amber-dim)}.day-card.has-adjust{border-color:var(--amber-bdr)}
.day-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.day-expand-icon{font-size:11px;color:var(--text3);flex-shrink:0;transition:transform .2s}.day-expand-icon.open{transform:rotate(90deg)}
.day-expanded{display:none;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border)}.day-expanded.open{display:block}
.day-name{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.day-type{font-size:12px;font-weight:500;margin-bottom:3px}.day-detail{font-size:11px;color:var(--text2);line-height:1.4}
.day-detail-full{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:6px}
.day-comment{font-size:10px;color:var(--green);font-family:var(--mono);font-style:italic;margin-bottom:4px}.day-comment.pending{color:var(--text3)}
.day-dot{width:6px;height:6px;border-radius:50%;margin-top:6px}.dot-done{background:var(--green)}.dot-modified{background:var(--amber)}.dot-pending{background:var(--text3)}
.day-adjust-banner{margin-top:6px;background:var(--amber-dim);border:0.5px solid var(--amber-bdr);border-radius:var(--radius-sm);padding:5px 8px;cursor:pointer}
.day-adjust-text{font-size:10px;color:var(--amber);line-height:1.4;display:block;margin:2px 0}
.day-adjust-toggle{font-size:10px;color:var(--blue);font-family:var(--mono)}
.day-adjust-detail{display:none;margin-top:6px}.day-adjust-detail.open{display:block}
.adjust-table{width:100%;border-collapse:collapse;font-size:11px}
.adjust-table th{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;padding:4px 6px;text-align:left;border-bottom:0.5px solid var(--border2);background:var(--bg3)}
.adjust-table td{padding:5px 6px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:top}
.adjust-table tr:last-child td{border-bottom:none}.adj-row-del td{color:var(--coral);text-decoration:line-through;opacity:.7}
.load-wrap{margin-bottom:20px}.load-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;font-family:var(--mono)}
.load-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}.load-fill{height:100%;border-radius:3px}
.notes-box{background:var(--bg2);border:0.5px solid var(--border2);border-left:3px solid var(--blue);border-radius:0 var(--radius) var(--radius) 0;padding:14px 18px;font-size:13px;color:var(--text2);line-height:1.6}
.status-legend{display:flex;gap:14px;margin-bottom:20px;font-size:11px;color:var(--text3)}.status-legend span{display:flex;align-items:center;gap:5px}
.chart-card{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:20px;margin-bottom:24px;box-shadow:var(--shadow)}
.chart-card-title{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px}
.chart-wrap{position:relative;width:100%;height:260px}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}.legend-dot{width:10px;height:10px;border-radius:2px}
.race-table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:0.5px solid var(--border2)}
.race-table th{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;text-align:left;border-bottom:0.5px solid var(--border2);background:var(--bg3);font-weight:500}
.race-table td{padding:12px 14px;border-bottom:0.5px solid var(--border);font-size:13px;vertical-align:middle}.race-table tr:last-child td{border-bottom:none}.race-table tr:hover td{background:var(--bg3)}
.race-time{font-family:var(--mono);font-weight:600}.race-pace{font-family:var(--mono);color:var(--text2);font-size:12px}
.race-name-main{font-weight:500}.race-name-sub{font-size:11px;color:var(--text3);margin-top:1px}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;font-family:var(--mono)}
.badge-best{background:var(--amber-dim);color:var(--amber);border:0.5px solid var(--amber-bdr)}.badge-pre{background:var(--green-dim);color:var(--green);border:0.5px solid var(--green-bdr)}.badge-post{background:var(--blue-dim);color:var(--blue);border:0.5px solid var(--blue-bdr)}
.pace-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:4px;width:80px}.pace-bar-fill{height:100%;border-radius:2px}
.timeline{position:relative;padding-left:20px}.tl-line{position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--border2)}
.tl-item{position:relative;padding:12px 0 12px 24px;border-bottom:0.5px solid var(--border)}.tl-item:last-child{border-bottom:none}
.tl-dot{position:absolute;left:-13px;top:17px;width:10px;height:10px;border-radius:50%}
.tl-period{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.tl-title{font-size:13px;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tl-desc{font-size:12px;color:var(--text2);margin-bottom:6px}
.tl-tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono)}
.tag-blue{background:var(--blue-dim);color:var(--blue)}.tag-green{background:var(--green-dim);color:var(--green)}.tag-amber{background:var(--amber-dim);color:var(--amber)}.tag-gray{background:var(--bg3);color:var(--text3)}.tag-coral{background:var(--coral-dim);color:var(--coral)}
.current-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--blue-dim);color:var(--blue);border:0.5px solid var(--blue-bdr);font-family:var(--mono)}
.exp-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}.exp-filters label{font-size:12px;color:var(--text2)}
.exp-filters select{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;color:var(--text);font-family:var(--sans);outline:none}
.filter-btn{font-size:12px;padding:6px 14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--sans)}
.filter-btn.secondary{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border2)}.filter-btn.secondary:hover{background:var(--bg3)}
.block-group{margin-bottom:12px;border:0.5px solid var(--border2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.block-header{background:var(--bg2);padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.block-header:hover{background:var(--bg3)}.block-header-left{display:flex;align-items:center;gap:12px}
.block-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.block-name{font-size:14px;font-weight:500}.block-meta{font-size:12px;color:var(--text3);font-family:var(--mono)}
.block-chevron{font-size:16px;color:var(--text3);transition:transform .2s;line-height:1}.block-chevron.open{transform:rotate(90deg)}
.block-body{display:none;border-top:0.5px solid var(--border)}.block-body.open{display:block}
.week-group{border-bottom:0.5px solid var(--border)}.week-group:last-child{border-bottom:none}
.week-header{padding:11px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--bg3);user-select:none}
.week-header:hover{background:var(--bg4)}.week-title{font-size:13px;font-weight:500}.week-obj{font-size:11px;color:var(--text2);margin-top:2px}
.week-chevron{font-size:14px;color:var(--text3);transition:transform .2s;line-height:1}.week-chevron.open{transform:rotate(90deg)}
.week-body{display:none;padding:16px 18px;background:var(--bg2)}.week-body.open{display:block}
.week-status-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-family:var(--mono);font-weight:500}
.ws-done{background:var(--green-dim);color:var(--green);border:0.5px solid var(--green-bdr)}.ws-current{background:var(--blue-dim);color:var(--blue);border:0.5px solid var(--blue-bdr)}.ws-planned{background:var(--bg3);color:var(--text3);border:0.5px solid var(--border2)}
.rut-exercise-row{padding:10px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-bottom:0.5px solid var(--border)}
.rut-exercise-row:hover{background:var(--bg4)}.rut-exercise-body{display:none;padding:16px 18px;background:var(--bg2);border-bottom:0.5px solid var(--border)}.rut-exercise-body.open{display:block}
.rut-key-list{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.rut-key-list li{font-size:12px;display:flex;gap:8px;align-items:flex-start}
.rut-prevention{background:var(--green-dim);border:0.5px solid var(--green-bdr);border-radius:var(--radius-sm);padding:9px 13px;font-size:11px;color:var(--green)}
@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.week-grid{grid-template-columns:repeat(4,1fr)}.main{padding:16px}.topbar{padding:0 16px}.tab-btn{padding:6px 10px;font-size:12px}}
@media(max-width:480px){.week-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">running dashboard</div>
    <div class="login-title">Bienvenido</div>
    <div class="login-sub">Introduce la contraseña para acceder.</div>
    <input type="password" id="pwd-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkLogin()" autofocus/>
    <button onclick="checkLogin()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <div class="topbar-logo">running</div>
      <div class="topbar-title">Miguel · Seguimiento de entrenamiento</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="last-update" id="last-update-label"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="main">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('semana',this)">Estado semanal</button>
      <button class="tab-btn" onclick="showTab('progresion',this)">Progresión</button>
      <button class="tab-btn" onclick="showTab('competiciones',this)">Competiciones</button>
      <button class="tab-btn" onclick="showTab('historico',this)">Histórico</button>
      <button class="tab-btn" onclick="showTab('planificacion',this)">Planificación</button>
      <button class="tab-btn" onclick="showTab('rutinas',this)">Rutinas</button>
    </div>
    <div id="tab-semana" class="tab-content active"></div>
    <div id="tab-progresion" class="tab-content"></div>
    <div id="tab-competiciones" class="tab-content"></div>
    <div id="tab-historico" class="tab-content"></div>
    <div id="tab-planificacion" class="tab-content"></div>
    <div id="tab-rutinas" class="tab-content"></div>
  </div>
</div>
<script>
const PWD = `271975`;

const DATA = {
  currentBlock: `Pausa — lesión rodilla`,
  weekNumber: 4,
  currentVo2: 47,
  currentPace: `5:10-5:20`,
  estRace10k: `~52:30`,
  fatigueLevel: 3,
  dorsalOk: true,
  dorsalStatus: `Sin incidencias`,
  kneeInjury: true,
  kneeStatus: `Tendinopatía rotuliana izq. (impacto). Dos sesiones de prueba sin peso (sáb-dom) bien toleradas. A las 24h del lunes: sin molestia al bajar escaleras (gesto resuelto). Queda molestia residual puntual solo en flexión profunda con carga. Fisio autoriza por mensaje volver a correr de forma progresiva por sensaciones y progresar carga en gimnasio. Mañana martes: primera prueba de trote controlado + primera carga externa ligera en pierna.`,
  weekLoad: 15,
  weekNotes: `LESIÓN: Tendinopatía rotuliana rodilla izquierda (impacto), diagnosticada por fisio tras la tirada larga del domingo anterior. Lunes a miércoles: semana suspendida por precaución. Jueves: sesión de fisio — dolor evolucionando de 7-8/10 a 2/10, autoriza prueba unilateral sin peso. Viernes: descanso completo. Sábado y domingo: dos sesiones de prueba sin peso (pierna + tren superior), bien toleradas, con mejora progresiva — el dolor al bajar escaleras desaparece a las 24h del domingo, solo queda molestia residual en flexión profunda con carga. Lunes: el fisio confirma por mensaje que la pérdida de fuerza es mínima y autoriza volver a correr de forma progresiva por sensaciones, y progresar carga en gimnasio si la sensación es buena. Martes: primera prueba de trote controlado (intervalos cortos) + primera carga externa ligera en pierna, sin tren superior para no mezclar variables. La regla de oro se mantiene: el dolor manda sobre el calendario.`,
  lastUpdate: `23 jun 2026 — luz verde del fisio, prueba de trote programada para mañana`,
  weekDays: [
    {name:`Lun`,type:`Suspendido`,detail:`Semana suspendida por precaución tras el diagnóstico de tendinopatía rotuliana.`,result:`No ejecutado.`,status:`pending`},
    {name:`Mar`,type:`Suspendido`,detail:`Semana suspendida por precaución.`,result:`No ejecutado.`,status:`pending`},
    {name:`Mié`,type:`Suspendido`,detail:`Sesión de prueba unilateral pospuesta por precaución tras el diagnóstico de tendinopatía rotuliana.`,result:`No ejecutado. Semana en pausa hasta el viernes.`,status:`pending`},
    {name:`Jue`,type:`Fisio`,detail:`Sesión de fisioterapia. Diagnóstico: tendinopatía rotuliana izquierda por impacto.`,result:`Dolor evolucionando de 7-8/10 a 2/10. Tratamiento: descarga + fortalecimiento unilateral progresivo cuando ceda dolor. Autoriza prueba unilateral sin peso.`,status:`done`},
    {name:`Vie`,type:`Descanso`,detail:`Día de descanso. Sin actividad de pierna ni gimnasio. Running sigue suspendido a la espera de confirmación del fisio.`,result:`Ejecutado. Día de descanso tras el diagnóstico del jueves.`,status:`done`},
    {name:`Sáb`,type:`Prueba unilateral + tren sup.`,detail:`Primera sesión de prueba tras el diagnóstico. Fisio autoriza: unilateral sin peso, progresión muy conservadora. Step-up bajo 2x6/pierna · Búlgara rango parcial 2x6/lado · Split squat isométrico 2x15-20s/pierna · Plancha lateral 2x25s. + Espalda y brazos: Jalón 3x10 · Remo polea 3x10 · Curl biceps 2x12 · Triceps polea 2x12 · Face pull 3x12. Sin running, sin carga externa en pierna.`,result:`Sin dolor durante los ejercicios. Sin dolor al subir escaleras justo después. A las 24h: dolor leve al bajar escaleras en los primeros ~20 escalones (luego desaparece) + 1/10 puntual a lo largo del día. Buena tolerancia, todavía no es el 0/10 que pide el fisio para progresar.`,status:`done`,adjust:`Primera prueba de carga en rodilla izquierda desde la lesión. Evaluada a las 24h, no en el momento. Espalda/brazos sin restricción.`,adjustDetail:[{ejercicio:`Step-up bajo`,series:`2x6 por pierna`,nota:`Escalón pequeño, no cajón de gym. Bajada controlada en 3 seg (el descenso es lo que más carga el tendón). Parar si hay molestia al subir con la izquierda.`},{ejercicio:`Búlgara rango parcial`,series:`2x6 por lado`,nota:`Solo 15-20cm de bajada, sin buscar profundidad. Pie trasero en step bajo.`},{ejercicio:`Split squat isométrico`,series:`2x15-20s por pierna`,nota:`Sin movimiento, sin componente excéntrico de impacto. La opción más segura de las tres.`},{ejercicio:`Plancha lateral`,series:`2x25s por lado`,nota:`Trabajo de core añadido, sin implicación directa de la rodilla.`},{ejercicio:`Jalón al pecho`,series:`3x10`,nota:`Carga moderada, sin saltar del asiento.`},{ejercicio:`Remo en polea sentado`,series:`3x10`,nota:`Espalda neutra, no torcer para compensar.`},{ejercicio:`Curl bíceps mancuernas`,series:`2x12`,nota:`Sentado, carga ligera-moderada.`},{ejercicio:`Tríceps en polea`,series:`2x12`,nota:`De pie o sentado, sin implicar la pierna izquierda en el apoyo.`},{ejercicio:`Face pull`,series:`3x12`,nota:`Prioritario para prevención dorsal. Codos altos, retracción escapular activa.`}]},
    {name:`Dom`,type:`Prueba unilateral + tren sup/pecho`,detail:`Segunda sesión de prueba, mismo bloque de pierna que ayer, sin progresión: Step-up bajo 2x6/pierna · Búlgara rango parcial 2x6/lado · Split squat isométrico 2x15-20s/pierna · Plancha lateral 2x25s/lado. + Espalda, pecho y brazo: Jalón 3x10 · Remo polea 3x10 · Press pecho en máquina 3x10 · Curl bíceps 2x12 · Tríceps polea 2x12 · Face pull 3x12.`,result:`Ejecutado tal y como estaba planificado. A las 24h (lunes): sin molestia al bajar escaleras (gesto ya resuelto). Queda molestia residual puntual solo en flexión profunda con carga, tipo levantarse de un asiento bajo. Marcha normal indolora. Mejora clara y consistente respecto al sábado.`,status:`done`,adjust:`Dato de 24h tras la sesión del sábado: dolor al bajar escaleras en los primeros ~20 escalones, luego desaparece. Se mantiene el mismo volumen de pierna (sin progresar) hasta confirmar 0/10 limpio. Se añade press de pecho en máquina (no banca libre) por petición del usuario, evitando flexión torácica sostenida.`,adjustDetail:[{ejercicio:`Step-up bajo`,series:`2x6 por pierna`,nota:`Igual que la sesión de ayer. Bajada controlada 3 seg.`},{ejercicio:`Búlgara rango parcial`,series:`2x6 por lado`,nota:`15-20cm, sin progresar rango todavía.`},{ejercicio:`Split squat isométrico`,series:`2x15-20s por pierna`,nota:`Sin movimiento.`},{ejercicio:`Plancha lateral`,series:`2x25s por lado`,nota:`Se mantiene, bien tolerada ayer.`},{ejercicio:`Jalón al pecho`,series:`3x10`,nota:`Sin restricción.`},{ejercicio:`Remo en polea sentado`,series:`3x10`,nota:`Espalda neutra.`},{ejercicio:`Press pecho en máquina`,series:`3x10`,nota:`Máquina guiada, no banca libre con barra — evita flexión torácica sostenida por antecedente dorsal.`},{ejercicio:`Curl bíceps mancuernas`,series:`2x12`,nota:`Carga ligera-moderada.`},{ejercicio:`Tríceps en polea`,series:`2x12`,nota:`Sin implicar apoyo de la pierna izquierda.`},{ejercicio:`Face pull`,series:`3x12`,nota:`Prioritario para prevención dorsal.`}]},
    {name:`Lun`,type:`Comunicación fisio`,detail:`El fisio confirma vía mensaje: poca pérdida de fuerza por el tiempo breve de baja actividad. Autoriza volver a correr de forma progresiva, guiándose por sensaciones, y progresar carga en gimnasio si la sensación es buena.`,result:`Sin sesión física hoy. Luz verde del fisio para iniciar la primera prueba real de impacto (trote) y empezar a introducir carga ligera en el bloque de pierna.`,status:`done`},
    {name:`Mar`,type:`Primera prueba de trote + Gym pierna`,detail:`Primera reintroducción de impacto tras la lesión. Calentamiento 5 min andando + movilidad rodilla/tobillo. Trote muy suave en llano: 3 series de 3 min trote + 2 min andando (~9 min trote real), ritmo cómodo sin buscar dato. Si aparece dolor que sube durante el trote: parar esa serie y caminar el resto. Después, en el gimnasio, bloque de pierna con primera carga externa ligera: Step-up bajo 2x10/pierna (sin carga) · Búlgara rango parcial 2x8/lado con mancuernas 4-6kg · Sentadilla goblet rango cómodo 2x10 · Plancha lateral 2x30s/lado. Sin tren superior hoy — el desplazamiento + trote ya ocupa ~30 min y se prioriza evaluar limpiamente la respuesta al impacto sin mezclar variables.`,result:``,status:`pending`,adjust:`Tras consultar con el fisio, se introduce el primer estímulo de impacto real (trote) de forma muy controlada, y se da el primer paso de carga externa en el bloque de pierna (búlgara con mancuernas ligeras, sentadilla goblet). Se elimina tren superior de esta sesión para no mezclar estímulos nuevos el mismo día que se evalúa la respuesta al impacto.`,adjustDetail:[{ejercicio:`Trote en intervalos`,series:`3x3min trote / 2min andando`,nota:`Terreno llano, ritmo cómodo. Parar si aparece dolor que sube durante el trote, no fatiga normal.`},{ejercicio:`Step-up bajo`,series:`2x10 por pierna`,nota:`Sin carga externa todavía, +2 reps respecto a la sesión del domingo.`},{ejercicio:`Búlgara rango parcial`,series:`2x8 por lado, mancuernas 4-6kg`,nota:`Primera carga externa ligera. Mismo rango parcial 15-20cm.`},{ejercicio:`Sentadilla goblet`,series:`2x10, rango cómodo`,nota:`Trabaja activamente la molestia residual de flexión profunda, con carga controlada y sin impacto.`},{ejercicio:`Plancha lateral`,series:`2x30s por lado`,nota:`+5s respecto a domingo.`}]},

// ── UTILS ──────────────────────────────────────────────────────────────
function paceStr(v){const m=Math.floor(v),s=Math.round((v-m)*60);return m+':'+String(s).padStart(2,'0')}

function checkLogin(){
  if(document.getElementById('pwd-input').value===PWD){
    sessionStorage.setItem('auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    initApp();
  }else{
    document.getElementById('login-error').style.display='block';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}
function logout(){
  sessionStorage.removeItem('auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-input').value='';
}
function showTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
}
function toggleBlock(id){
  const b=document.getElementById(id),c=document.getElementById('chev-'+id);
  b.classList.toggle('open');c.classList.toggle('open');
}
function toggleWeek(id){
  const b=document.getElementById(id),c=document.getElementById('chev-'+id);
  b.classList.toggle('open');c.classList.toggle('open');
}
function toggleDayExpand(id,event){
  if(event)event.stopPropagation();
  const el=document.getElementById(id),icon=document.getElementById('icon-'+id);
  if(!el)return;
  const open=el.classList.toggle('open');
  if(icon)icon.classList.toggle('open',open);
}
function toggleAdjust(id){
  const el=document.getElementById(id),tog=document.getElementById('tog-'+id);
  const open=el.classList.toggle('open');
  if(tog)tog.textContent=open?'ocultar ‹':'ver detalle ›';
}
function toggleRutExercise(id){
  const el=document.getElementById(id),chev=document.getElementById('chev-'+id);
  el.classList.toggle('open');if(chev)chev.classList.toggle('open');
}

// ── DAY CARDS ──────────────────────────────────────────────────────────
function buildDayCards(days,showResult,ctxId){
  const sc={done:'done',modified:'modified',pending:''};
  const dc={done:'dot-done',modified:'dot-modified',pending:'dot-pending'};
  return `<div class="week-grid">${days.map((d,di)=>{
    const hasAdjust=d.adjust;
    const adjId=`adj-${ctxId||'w'}-${di}`;
    const expId=`exp-${ctxId||'w'}-${di}`;
    const resultText=d.result||'Pendiente';
    const resultClass=d.result?'day-comment':'day-comment pending';
    const shortDetail=d.detail.length>42?d.detail.substring(0,40)+'…':d.detail;
    return `<div class="day-card ${sc[d.status]}${hasAdjust?' has-adjust':''}" onclick="toggleDayExpand('${expId}',event)">
      <div class="day-card-header">
        <div>
          <div class="day-name">${d.name}</div>
          <div class="day-type">${d.type}</div>
          <div class="day-detail">${shortDetail}</div>
        </div>
        <span class="day-expand-icon" id="icon-${expId}">›</span>
      </div>
      <div class="day-expanded" id="${expId}" onclick="event.stopPropagation()">
        <div class="day-detail-full">${d.detail}</div>
        ${showResult?`<div class="${resultClass}"><strong>Estado:</strong> ${resultText}</div>`:''}
        ${hasAdjust?`<div class="day-adjust-banner" onclick="toggleAdjust('${adjId}')">
          <span class="day-adjust-text">⚡ ${d.adjust}</span>
          <span class="day-adjust-toggle" id="tog-${adjId}">ver detalle ›</span>
        </div>
        <div class="day-adjust-detail" id="${adjId}">
          <table class="adjust-table">
            <thead><tr><th>Ejercicio</th><th>Series</th><th>Nota</th></tr></thead>
            <tbody>${d.adjustDetail.map(a=>`<tr class="${a.ejercicio.startsWith('ELIMINAR')?'adj-row-del':''}">
              <td>${a.ejercicio}</td><td style="font-family:var(--mono);white-space:nowrap">${a.series}</td><td>${a.nota}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`:''}
      </div>
      <div class="day-dot ${dc[d.status]}"></div>
    </div>`;
  }).join('')}</div>`;
}

// ── SEMANA ─────────────────────────────────────────────────────────────
function renderSemana(){
  const d=DATA;
  const loadColor=d.weekLoad>85?'#dc2626':d.weekLoad>65?'#d97706':'#16a34a';
  let html='';
  html+=`<div class="metrics">
    <div class="metric-card accent-blue"><div class="metric-label">Bloque actual</div><div class="metric-val blue" style="font-size:17px">${d.currentBlock}</div><div class="metric-sub">Semana ${d.weekNumber} de 4</div></div>
    <div class="metric-card"><div class="metric-label">Fatiga</div><div class="metric-val ${d.fatigueLevel>=7?'coral':d.fatigueLevel>=5?'amber':'green'}">${d.fatigueLevel}/10</div><div class="metric-sub">${d.fatigueLevel<=4?'baja':d.fatigueLevel<=6?'moderada':'alta'}</div></div>
    <div class="metric-card"><div class="metric-label">Carga semanal</div><div class="metric-val">${d.weekLoad}%</div><div class="metric-sub">del objetivo</div></div>
    <div class="metric-card ${d.dorsalOk?'accent-green':'accent-coral'}"><div class="metric-label">Espalda dorsal</div><div class="metric-val ${d.dorsalOk?'green':'coral'}" style="font-size:17px">${d.dorsalOk?'OK':'Atención'}</div><div class="metric-sub">${d.dorsalStatus}</div></div>
  </div>`;
  html+=`<div class="load-wrap"><div class="load-label"><span>carga acumulada semana</span><span>${d.weekLoad}%</span></div><div class="load-track"><div class="load-fill" style="width:${d.weekLoad}%;background:${loadColor}"></div></div></div>`;
  html+=`<div class="section-label">Semana ${d.weekNumber} — día a día</div>`;
  html+=buildDayCards(d.weekDays,true,'sw');
  html+=`<div class="status-legend">
    <span><span style="width:6px;height:6px;border-radius:50%;background:#16a34a;display:inline-block"></span>ejecutado</span>
    <span><span style="width:6px;height:6px;border-radius:50%;background:#d97706;display:inline-block"></span>ajustado</span>
    <span><span style="width:6px;height:6px;border-radius:50%;background:#9aa0ad;display:inline-block"></span>pendiente</span>
  </div>`;
  if(d.weekNotes)html+=`<div class="section-label">Notas del entrenador</div><div class="notes-box">${d.weekNotes}</div>`;
  document.getElementById('tab-semana').innerHTML=html;
}

// ── COMPETICIONES ──────────────────────────────────────────────────────

  const lastPost=[...d.competitions].filter(c=>c.phase==='post').pop();
  const recov=Math.round((best.pace/(lastPost?lastPost.pace:best.pace))*100);
  document.getElementById('tab-competiciones').innerHTML=`
    <div class="metrics">
      <div class="metric-card accent-amber"><div class="metric-label">Mejor marca 10K</div><div class="metric-val amber">${best.time}</div><div class="metric-sub">${best.name} · ${best.date}</div></div>

      <div class="metric-card"><div class="metric-label">Última post-lesión</div><div class="metric-val">${lastPost?lastPost.time:'—'}</div><div class="metric-sub">${lastPost?lastPost.name+' · '+lastPost.date:'—'}</div></div>
      <div class="metric-card accent-green"><div class="metric-label">Recuperación estimada</div><div class="metric-val green">~${recov}%</div><div class="metric-sub">del nivel de mejor marca</div></div>
    </div>

      <div class="chart-card-title">ritmo por competición (min/km) — menor es mejor</div>
      <div class="chart-wrap"><canvas id="compChart"></canvas></div>
    </div>
    <div class="section-label">Historial completo</div>
    <table class="race-table">
      <thead><tr><th>Carrera</th><th>Tiempo</th><th>Ritmo</th><th>FC</th><th>Desn.</th><th>Fase</th></tr></thead>
      <tbody>${d.competitions.map(c=>`<tr>

        borderWidth:1.5,borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>'Ritmo: '+paceStr(c.raw)+'/km'}}},
      scales:{y:{reverse:true,min:4.5,max:6.4,grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#9aa0ad',font:{size:11},callback:(v)=>paceStr(v)}},x:{grid:{display:false},ticks:{color:'#9aa0ad',font:{size:10},maxRotation:35,autoSkip:false}}}}
  });
}

// ── EXPANDABLE BLOCKS (shared by Histórico & Planificación) ────────────
function buildExpandableBlocks(blocks,showDoneOnly,filterBlockId,prefix){
  const btc={current:'#2563eb',planned:'#16a34a',maint:'#9aa0ad',peak:'#d97706',race:'#dc2626'};
  const wsl={done:'ejecutada',current:'en curso',planned:'planificada'};
  const wsc={done:'ws-done',current:'ws-current',planned:'ws-planned'};
  let filtered=blocks;
  if(filterBlockId)filtered=blocks.filter(b=>b.id===filterBlockId);
  if(showDoneOnly)filtered=filtered.map(b=>({...b,weeks:b.weeks.filter(w=>w.status==='done'||w.status==='current')})).filter(b=>b.weeks.length>0);
  if(!filtered.length)return '<div class="no-results">No hay semanas que mostrar con los filtros seleccionados.</div>';
  return filtered.map((block,bi)=>`
    <div class="block-group">
      <div class="block-header" onclick="toggleBlock('${prefix}bg${bi}')">
        <div class="block-header-left">
          <span class="block-dot" style="background:${btc[block.type]||'#9aa0ad'}"></span>
          <span class="block-name">${block.name}</span>
          <span class="block-meta">${block.period}</span>
        </div>
        <span class="block-chevron" id="chev-${prefix}bg${bi}">›</span>
      </div>
      <div class="block-body" id="${prefix}bg${bi}">
        ${block.weeks.map((week,wi)=>`
          <div class="week-group">
            <div class="week-header" onclick="toggleWeek('${prefix}wg${bi}-${wi}')">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="week-title">${week.label}</span>
                  <span class="week-status-badge ${wsc[week.status]}">${wsl[week.status]}</span>
                </div>
                <div class="week-obj">${week.dateStart} · <em>${week.objetivo}</em></div>
              </div>
              <span class="week-chevron" id="chev-${prefix}wg${bi}-${wi}">›</span>
            </div>
            <div class="week-body" id="${prefix}wg${bi}-${wi}">
              ${buildDayCards(week.days,true,`${prefix}b${bi}w${wi}`)}
              ${week.notes?`<div class="section-label" style="margin-top:12px">Notas del entrenador</div><div class="notes-box">${week.notes}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── HISTÓRICO ──────────────────────────────────────────────────────────
function renderHistorico(){
  const opts=DATA.blocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('tab-historico').innerHTML=`
    <div class="exp-filters">
      <label>Bloque</label>
      <select id="hist-block"><option value="">Todos los bloques</option>${opts}</select>
      <button class="filter-btn" onclick="applyHistorico()">Filtrar</button>
      <button class="filter-btn secondary" onclick="resetHistorico()">Limpiar</button>
    </div>
    <div id="hist-content">${buildExpandableBlocks(DATA.blocks,true,'','h')}</div>`;
}
function applyHistorico(){document.getElementById('hist-content').innerHTML=buildExpandableBlocks(DATA.blocks,true,document.getElementById('hist-block').value,'h')}
function resetHistorico(){document.getElementById('hist-block').value='';document.getElementById('hist-content').innerHTML=buildExpandableBlocks(DATA.blocks,true,'','h')}

// ── PLANIFICACIÓN ──────────────────────────────────────────────────────
function renderPlanificacion(){
  const opts=DATA.blocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('tab-planificacion').innerHTML=`
    <div class="exp-filters">
      <label>Bloque</label>
      <select id="plan-block"><option value="">Todos los bloques</option>${opts}</select>
      <button class="filter-btn" onclick="applyPlan()">Filtrar</button>
      <button class="filter-btn secondary" onclick="resetPlan()">Ver todos</button>
    </div>
    <div id="plan-content">${buildExpandableBlocks(DATA.blocks,false,'','p')}</div>`;
}
function applyPlan(){document.getElementById('plan-content').innerHTML=buildExpandableBlocks(DATA.blocks,false,document.getElementById('plan-block').value,'p')}
function resetPlan(){document.getElementById('plan-block').value='';document.getElementById('plan-content').innerHTML=buildExpandableBlocks(DATA.blocks,false,'','p')}

// ── RUTINAS ────────────────────────────────────────────────────────────
function renderRutinas(){
  let html='';
  RUTINAS.forEach((rutina,ri)=>{
    html+=`<div class="block-group">
      <div class="block-header" onclick="toggleBlock('rut${ri}')">
        <div class="block-header-left">
          <span style="font-size:18px;line-height:1">${rutina.icon}</span>
          <span class="block-name">${rutina.name}</span>
        </div>
        <span class="block-chevron" id="chev-rut${ri}">›</span>
      </div>
      <div class="block-body" id="rut${ri}">
        <div style="padding:10px 18px;font-size:12px;color:var(--text2);border-bottom:0.5px solid var(--border);font-style:italic">${rutina.objetivo}</div>
        ${rutina.ejercicios.map((ej,ei)=>`
          <div>
            <div class="rut-exercise-row" onclick="toggleRutExercise('rutex${ri}-${ei}')">
              <div style="display:flex;align-items:center;gap:14px;flex:1">
                <span style="font-size:13px;font-weight:500">${ej.nombre}</span>
                <span style="font-size:11px;font-family:var(--mono);color:var(--text3)">${ej.series}</span>
                ${ej.peso!=='—'?`<span style="font-size:11px;font-family:var(--mono);color:var(--text3)">${ej.peso}</span>`:''}
                ${ej.descanso!=='—'?`<span style="font-size:11px;font-family:var(--mono);color:var(--blue);background:var(--blue-dim);padding:1px 7px;border-radius:4px">desc ${ej.descanso}</span>`:''}
              </div>
              <span class="week-chevron" id="chev-rutex${ri}-${ei}">›</span>
            </div>
            <div class="rut-exercise-body" id="rutex${ri}-${ei}">
              <p style="font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:14px">${ej.descripcion}</p>
              <div style="margin-bottom:12px">
                <div style="font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:8px">Claves de ejecución</div>
                <ul class="rut-key-list">${ej.claves.map(c=>`<li><span style="color:var(--green);font-size:14px;flex-shrink:0">›</span>${c}</li>`).join('')}</ul>
              </div>
              <div class="rut-prevention"><strong>Para el running:</strong> ${ej.prevencion}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('tab-rutinas').innerHTML=html;
}

// ── INIT ───────────────────────────────────────────────────────────────
function initApp(){
  document.getElementById('last-update-label').textContent='Actualizado: '+DATA.lastUpdate;
  renderSemana();
  renderProgresion();
  renderCompeticiones();
  renderHistorico();
  renderPlanificacion();
  renderRutinas();
}

if(sessionStorage.getItem('auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}
</script>
</body>
</html>
