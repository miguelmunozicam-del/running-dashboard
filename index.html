<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E2F2B">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Running">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
<title>Running Dashboard — Miguel</title>
<style>
@font-face{font-family:'Bricolage';src:url('fonts/bricolage.woff2') format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'Hanken';src:url('fonts/hanken.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  --ground:#ECF0EE;--surface:#fff;--surface2:#F3F6F4;--line:rgba(14,47,43,.11);--line2:rgba(14,47,43,.2);
  --text:#10211F;--text2:#42554F;--text3:#5C6E69;
  --pine:#0E2F2B;--pine2:#14403A;
  --run:#F5B300;--run-ink:#7A5600;--run-soft:#FFF4D1;
  --lift:#5B4CF0;--lift-soft:#ECEAFF;
  --ok:#0B7F63;--ok-soft:#DDF5EC;
  --warn:#D6393F;--warn-soft:#FDE8E8;
  --pre:#2C7A6B;
  --display:'Bricolage',ui-rounded,system-ui,sans-serif;--sans:'Hanken',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:26px;--r-md:18px;--r-sm:12px;
  --shadow:0 1px 2px rgba(14,47,43,.06),0 8px 24px -12px rgba(14,47,43,.18);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  /* alias de compatibilidad con estilos en línea y bloques antiguos */
  --bg:var(--ground);--bg2:var(--surface);--bg3:var(--surface2);--bg4:var(--line);--border:var(--line);--border2:var(--line2);
  --blue:var(--lift);--blue-dim:var(--lift-soft);--blue-bdr:var(--lift);--green:var(--ok);--green-dim:var(--ok-soft);--green-bdr:var(--ok);
  --amber:var(--run-ink);--amber-dim:var(--run-soft);--amber-bdr:var(--run);--coral:var(--warn);--coral-dim:var(--warn-soft);--coral-bdr:var(--warn);--mono:var(--display);
}
@media(prefers-color-scheme:dark){:root{
  --ground:#08130F;--surface:#10201C;--surface2:#172B26;--line:rgba(220,245,238,.1);--line2:rgba(220,245,238,.2);
  --text:#E8F1EE;--text2:#B4C6C0;--text3:#8DA39C;
  --pine:#0F3530;--pine2:#14403A;
  --run-ink:#F5B300;--run-soft:#2A2208;--lift:#9A8FFF;--lift-soft:#201E45;--ok:#34D3A3;--ok-soft:#0E2E25;--warn:#FF7A7F;--warn-soft:#331517;--pre:#4FBFA5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--lift);outline-offset:2px;border-radius:8px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- Acceso ---------- */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;background:var(--pine);position:relative;overflow:hidden}
#login-screen::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% 115%,transparent 0 34px,rgba(255,255,255,.055) 34px 35px)}
.login-box{position:relative;width:100%;max-width:380px;color:#EAF4F1}
.login-mark{margin-bottom:28px}
.login-title{font-family:var(--display);font-size:40px;line-height:1.02;font-weight:700;letter-spacing:-.025em;margin-bottom:10px}
.login-sub{color:#A9C2BC;margin-bottom:28px}
.login-box input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:var(--r-sm);padding:14px 16px;color:#fff;font-size:17px;min-height:52px;font-family:var(--sans);outline:none;letter-spacing:.1em}
.login-box input:focus{border-color:var(--run);box-shadow:0 0 0 4px rgba(245,179,0,.2)}
.login-box button{width:100%;margin-top:12px;background:var(--run);border:none;border-radius:var(--r-sm);min-height:52px;color:#2B1E00;font-size:16px;font-weight:700;cursor:pointer}
.login-box button:active{transform:scale(.985)}
.login-error{font-size:13px;color:#FFB4B7;margin-top:10px;display:none}

/* ---------- Estructura ---------- */
#app{display:none}
#app.on{display:block}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + var(--safe-t)) 18px 10px;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--text2);cursor:pointer}
.rail{display:none}
.main{padding:6px 18px calc(110px + var(--safe-b));max-width:760px;margin:0 auto}
.tab-content{display:none}.tab-content.active{display:block}
.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:var(--pine);border-radius:26px;box-shadow:0 12px 32px -8px rgba(5,25,21,.55)}
.dock .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:none;background:none;color:#9DB8B1;font-size:11px;font-weight:500;border-radius:20px;cursor:pointer;min-height:52px}
.dock .nav-btn.active{background:rgba(255,255,255,.1);color:var(--run)}
.dock .nav-btn.active .ico{stroke-width:2.2}
.page-title{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.025em;margin:8px 0 18px}
.page-sub{color:var(--text2);margin:-12px 0 18px;font-size:14px}
.section-label{font-family:var(--display);font-size:18px;font-weight:650;letter-spacing:-.01em;margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-label small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text3)}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);border:1px solid var(--line)}

/* ---------- Portada: anillo de la semana ---------- */
.hero{position:relative;overflow:hidden;background:var(--pine);color:#EAF4F1;border-radius:var(--r-lg);padding:22px 20px 18px;margin-bottom:16px;box-shadow:0 18px 40px -22px rgba(5,25,21,.7)}
.hero::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 108% -18%,transparent 0 26px,rgba(255,255,255,.06) 26px 27px);pointer-events:none}
.hero>*{position:relative}
.hero-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;overflow:visible}
.ring-seg{fill:none;stroke-width:11;stroke-linecap:round}
.ring-seg.pending{stroke:rgba(255,255,255,.16)}
.ring-seg.run{stroke:var(--run)}.ring-seg.gym{stroke:#9A8FFF}
.ring-seg.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ringIn .9s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 120ms)}
@keyframes ringIn{to{stroke-dashoffset:0}}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center b{font-family:var(--display);font-size:42px;line-height:1;font-weight:700}
.ring-center span{font-size:12px;color:#A9C2BC;margin-top:3px}
.hero-kick{font-size:13px;color:#A9C2BC;margin-bottom:2px}
.hero-title{font-family:var(--display);font-size:25px;line-height:1.08;font-weight:700;letter-spacing:-.02em}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);border-radius:20px;padding:6px 11px 6px 9px;font-size:13px;font-weight:600}
.chip .ico{width:16px;height:16px}
.chip.ok{color:#5BE3BD}.chip.hot{color:#FFB4A8}.chip.mid{color:var(--run)}
.bars10{display:inline-grid;grid-template-columns:repeat(10,3px);gap:1.5px;align-items:end;height:12px}
.bars10 i{display:block;background:currentColor;opacity:.25;border-radius:1px;height:100%}
.bars10 i.on{opacity:1}
.hero-foot{margin-top:16px;font-size:12.5px;color:#8FB0A8}

/* ---------- Tira semanal ---------- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.sd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;border:none;background:none;cursor:pointer;border-radius:16px;min-width:0;-webkit-tap-highlight-color:transparent}
.sd-l{font-size:12px;font-weight:600;color:var(--text3)}
.sd-c{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--line2);color:var(--text3);background:var(--surface);transition:transform .15s}
.sd-c .ico{width:19px;height:19px}
.sd.rest .sd-c{border-style:dashed;background:transparent}
.sd.run.done .sd-c{background:var(--run);border-color:var(--run);color:#2B1E00}
.sd.gym.done .sd-c{background:var(--lift);border-color:var(--lift);color:#fff}
.sd.run:not(.done):not(.rest) .sd-c{border-color:var(--run);color:var(--run-ink)}
.sd.gym:not(.done):not(.rest) .sd-c{border-color:var(--lift);color:var(--lift)}
.sd.sel .sd-l{color:var(--text)}
.sd.sel .sd-c{transform:scale(1.1);box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--pine)}
@media(prefers-color-scheme:dark){.sd.sel .sd-c{box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--text)}}
.sd-today{width:5px;height:5px;border-radius:50%;background:var(--warn);margin-top:-1px}
.sd-today.off{visibility:hidden}

/* ---------- Panel del día ---------- */
.day{padding:20px 18px 18px;margin-bottom:6px}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.day-when{font-size:13px;color:var(--text3);margin-bottom:2px}
.day-title{font-family:var(--display);font-size:28px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--text2)}
.pill .ico{width:15px;height:15px;stroke-width:2.4}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.mod{background:var(--run-soft);color:var(--run-ink)}
.steps{list-style:none;margin:16px 0 4px;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:none}
.steps .n{font-family:var(--display);font-size:14px;font-weight:700;color:var(--text3);text-align:center}
.steps .t{font-size:15px;line-height:1.4}
.rx{font-family:var(--display);font-weight:700;background:var(--surface2);padding:1px 7px;border-radius:8px;white-space:nowrap}
.gym .rx{background:var(--lift-soft);color:var(--lift)}
.run .rx{background:var(--run-soft);color:var(--run-ink)}
.result{margin:14px 0 4px;padding:13px 14px;border-radius:var(--r-sm);background:var(--ok-soft);font-size:14px;line-height:1.5}
.result b{color:var(--ok)}
.result.pending{background:var(--surface2);color:var(--text3)}
.adjust{margin-top:12px;border-radius:var(--r-sm);background:var(--run-soft);overflow:hidden}
.adjust summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--text)}
.adjust summary::-webkit-details-marker{display:none}
.adjust summary .ico{color:var(--run-ink);margin-top:1px;width:20px;height:20px}
.adjust summary span{flex:1}
.adjust summary .chev{margin-top:3px;transition:transform .2s;color:var(--text3);width:18px;height:18px}
.adjust[open] summary .chev{transform:rotate(90deg)}
.adjust-body{padding:2px 14px 14px;overflow-x:auto}
.adjust-table{width:100%;border-collapse:collapse;font-size:13.5px}
.adjust-table th{text-align:left;font-size:12.5px;font-weight:600;color:var(--text3);padding:6px 8px 6px 0}
.adjust-table td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.adj-row-del td{color:var(--warn);text-decoration:line-through;opacity:.75}
.day-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:23px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--pine);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn:active{transform:scale(.98)}

/* ---------- Accesos rápidos ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px;min-height:132px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.975)}
.tile-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:14px}
.tile-ico.a{background:var(--lift-soft);color:var(--lift)}
.tile-ico.b{background:var(--run-soft);color:var(--run-ink)}
.tile-ico.c{background:var(--ok-soft);color:var(--ok)}
.tile-ico.d{background:var(--surface2);color:var(--text)}
.tile-t{font-family:var(--display);font-size:18px;font-weight:650;line-height:1.1;letter-spacing:-.01em}
.tile-s{font-size:13px;color:var(--text2);line-height:1.35;margin-top:auto}
.notes{padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--text2)}
.notes .nt.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.link-btn{background:none;border:none;color:var(--lift);font-weight:700;font-size:14px;padding:10px 0;cursor:pointer}

/* ---------- Progreso y carreras ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kpi{padding:16px}
.kpi-l{font-size:13px;color:var(--text3);margin-bottom:4px}
.kpi-v{white-space:nowrap;font-family:var(--display);font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
.kpi-s{font-size:12.5px;color:var(--text3);margin-top:4px;line-height:1.35}
.kpi.goal{background:var(--pine);color:#EAF4F1;border-color:transparent}
.kpi.goal .kpi-l,.kpi.goal .kpi-s{color:#A9C2BC}.kpi.goal .kpi-v{color:var(--run)}
.chart-card{padding:18px 14px 14px;margin-bottom:6px}
.chart-title{font-family:var(--display);font-size:17px;font-weight:650;padding:0 6px 2px}
.chart-sub{font-size:13px;color:var(--text3);padding:0 6px 10px}
.chart-card svg{width:100%;height:auto}
.ax{stroke:var(--line);stroke-width:1}
.ax-t{fill:var(--text3);font-size:11px;font-family:var(--sans)}
.ln-real{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ln-est{fill:none;stroke:var(--lift);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 7}
.ln-goal{stroke:var(--run);stroke-width:2;stroke-dasharray:6 5}
.dt-real{fill:var(--surface);stroke:var(--text);stroke-width:3}
.dt-est{fill:var(--surface);stroke:var(--lift);stroke-width:3}
.pt-t{font-family:var(--display);font-size:12px;font-weight:700;fill:var(--text);text-anchor:middle}
.pt-t.est{fill:var(--lift)}
.goal-t{font-family:var(--display);font-size:12px;font-weight:700;fill:var(--run-ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 6px 0;font-size:13px;color:var(--text2)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;margin-right:7px;vertical-align:3px}
.legend .real{border-color:var(--text)}.legend .est{border-color:var(--lift);border-top-style:dotted}.legend .goal{border-color:var(--run);border-top-style:dashed}
.timeline{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--line2)}
.tl-item{position:relative;padding:0 0 22px}
.tl-dot{position:absolute;left:-30px;top:3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--ground)}
.tl-period{font-size:13px;color:var(--text3);margin-bottom:1px}
.tl-title{font-family:var(--display);font-size:17px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.tl-desc{font-size:14px;color:var(--text2);margin-bottom:8px;line-height:1.45}
.tl-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.tag-blue,.tag-green{background:var(--ok-soft);color:var(--ok)}.tag-amber{background:var(--run-soft);color:var(--run-ink)}.tag-coral{background:var(--warn-soft);color:var(--warn)}.tag-gray{background:var(--surface2);color:var(--text3)}
.current-badge{font-family:var(--sans);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--pine);color:var(--run)}
.best{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--pine);color:#EAF4F1;border-radius:var(--r-lg);padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.best::before{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 108% -18%,transparent 0 26px,rgba(255,255,255,.06) 26px 27px)}
.best>*{position:relative}
.best-l{font-size:13px;color:#A9C2BC}
.best-v{font-family:var(--display);font-size:56px;line-height:1;font-weight:700;letter-spacing:-.035em;color:var(--run);margin:4px 0}
.best-s{font-size:13.5px;color:#A9C2BC}
.mini-ring{position:relative;width:86px;height:86px}
.mini-ring svg{width:100%;height:100%}
.mini-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.mini-ring small{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11.5px;color:#A9C2BC}
.races{display:flex;flex-direction:column;gap:10px}
.race{padding:14px 16px 14px}
.race-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.race-name{font-weight:650;font-size:15px}.race-meta{font-size:12.5px;color:var(--text3);margin-top:1px}
.race-time{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.race-bar{height:10px;border-radius:5px;background:var(--surface2);margin:12px 0 7px;overflow:hidden}
.race-bar i{display:block;height:100%;border-radius:5px}
.race-foot{display:flex;gap:14px;font-size:12.5px;color:var(--text2);flex-wrap:wrap}
.upnext{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.up{padding:16px}
.up-d{font-family:var(--display);font-size:38px;line-height:1;font-weight:700;letter-spacing:-.03em}
.up-d small{font-size:14px;font-weight:600;color:var(--text3);letter-spacing:0;margin-left:4px}
.up-n{font-weight:650;margin-top:8px;font-size:14.5px;line-height:1.25}.up-s{font-size:12.5px;color:var(--text3);margin-top:2px}

/* ---------- Histórico, plan y rutinas ---------- */
.exp-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.exp-filters label{font-size:13px;color:var(--text2);font-weight:600}
.exp-filters select{flex:1;min-width:160px;min-height:44px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:0 12px;font-size:15px;color:var(--text);font-family:var(--sans)}
.filter-btn{min-height:44px;padding:0 18px;background:var(--pine);color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer}

.block-group{margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.block-header{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;user-select:none;min-height:60px}
.block-header-left{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.block-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.block-name{font-family:var(--display);font-size:17px;font-weight:650;letter-spacing:-.01em}
.block-meta{font-size:13px;color:var(--text3)}
.block-chevron,.week-chevron{font-size:20px;color:var(--text3);transition:transform .2s;line-height:1}
.block-chevron.open,.week-chevron.open{transform:rotate(90deg)}
.block-body{display:none;border-top:1px solid var(--line)}.block-body.open{display:block}
.week-group{border-bottom:1px solid var(--line)}.week-group:last-child{border-bottom:none}
.week-header{padding:13px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);user-select:none;min-height:56px}
.week-title{font-weight:700;font-size:14.5px}.week-obj{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4}
.week-body{display:none;padding:14px 14px 16px}.week-body.open{display:block}
.week-status-badge{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:700}
.ws-done{background:var(--ok-soft);color:var(--ok)}.ws-current{background:var(--pine);color:var(--run)}.ws-planned{background:var(--surface2);color:var(--text3)}
.week-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.day-card.done{border-left:4px solid var(--ok)}.day-card.modified{border-left:4px solid var(--run)}
.day-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.day-name{font-size:12.5px;color:var(--text3);font-weight:600}
.day-type{font-family:var(--display);font-weight:650;font-size:16px}
.day-detail{font-size:13.5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.day-card.open .day-detail{display:none}
.day-expand-icon{color:var(--text3);transition:transform .2s;font-size:18px}.day-expand-icon.open{transform:rotate(90deg)}
.day-expanded{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.day-expanded.open{display:block}
.day-detail-full{font-size:14px;line-height:1.55;color:var(--text)}

.day-status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text3);margin-top:8px}
.day-dot{width:8px;height:8px;border-radius:50%}.dot-done{background:var(--ok)}.dot-modified{background:var(--run)}.dot-pending{background:var(--text3)}
.day-adjust-banner{margin-top:10px;background:var(--run-soft);border-radius:10px;padding:9px 12px;cursor:pointer}
.day-adjust-text{font-size:13px;line-height:1.45;display:block}.day-adjust-toggle{font-size:13px;color:var(--lift);font-weight:700}
.day-adjust-detail{display:none;margin-top:8px;overflow-x:auto}.day-adjust-detail.open{display:block}
.notes-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--text2);line-height:1.6}
.no-results{padding:30px 10px;text-align:center;color:var(--text3)}
.rut-exercise-row{padding:13px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border-bottom:1px solid var(--line);min-height:52px}
.rut-exercise-row>div{flex-wrap:wrap;row-gap:4px}
.rut-exercise-body{display:none;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}.rut-exercise-body.open{display:block}
.rut-key-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.rut-key-list li{font-size:14px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.rut-prevention{background:var(--ok-soft);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--text);line-height:1.5}

/* ---------- Hoja inferior ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,18,15,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:560px;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-size:24px;letter-spacing:-.02em;margin-bottom:4px}
.sheet p.s{font-size:14px;color:var(--text2);margin-bottom:14px}
.zone{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.zone i{width:10px;height:36px;border-radius:5px}
.zone b{display:block;font-size:15px}.zone span{font-size:13px;color:var(--text2)}
.zone em{font-style:normal;font-family:var(--display);font-weight:700;font-size:17px}
.ref{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.ref span{color:var(--text2)}.ref b{font-family:var(--display);font-weight:700;text-align:right}
.sheet .btn{width:100%;margin-top:16px}

/* ---------- Escritorio ---------- */
@media(min-width:900px){
  body{font-size:15.5px}
  .appbar,.dock{display:none}
  #app.on{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:26px 16px 20px;background:var(--pine);color:#EAF4F1}
  .rail .brand{padding:0 10px 26px;font-size:21px}
  .rail .nav-btn{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:none;background:none;color:#A9C2BC;font-size:15px;font-weight:600;border-radius:14px;cursor:pointer;text-align:left}
  .rail .nav-btn:hover{background:rgba(255,255,255,.06)}
  .rail .nav-btn.active{background:rgba(255,255,255,.1);color:var(--run)}
  .rail-foot{margin-top:auto;font-size:12.5px;color:#7FA198;padding:0 10px}
  .rail-foot .nav-btn{margin-top:8px;padding:0 2px}
  .main{max-width:1120px;width:100%;padding:34px 40px 60px;margin:0}
  .page-title{font-size:38px;margin-top:0}
  .home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .home .col-r{position:sticky;top:24px}
  .home .col-r .section-label:first-child{margin-top:0}
  .tiles{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
  .races{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sheet{bottom:50%;transform:translateY(60%) scale(.97);opacity:0;border-radius:28px;max-height:80vh;transition:transform .25s,opacity .2s;pointer-events:none}
  .sheet.on{transform:translateY(50%);opacity:1;pointer-events:auto}
}
@media(max-width:380px){.ring{width:112px;height:112px}.hero-title{font-size:22px}.day-title{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.ring-seg.draw{stroke-dashoffset:0}}

  weekLoad: 0,
  weekNotes: `Semana 7 Q4 (S7, 26 oct-1 nov) — Tempo continuo de 25' el viernes (referencia: 20' a 5'34'' con FC 147 el 2 oct), progresión de +5 min. Estructura completa: Gym A el martes (banca 39kg, pierna con carga prudente, curl 8kg), rodaje Z2 el miércoles, Gym B el jueves, trasladado al sábado (press de pecho 11,5kg, tríceps 13,5kg, farmer 35s y Pallof recuperado) y largo de 65 min el domingo, con tramo final más rápido opcional. Estado de partida: S6 cerrada completa sin molestias dorsales ni de rodilla; el largo del 25 oct salió a 6'14'' con FC 131 y sin deriva, con cuádriceps algo cargados en las cuestas desde el km 6. Fatiga 5/10. El Gym B va el día antes del tempo: si el jueves hay pesadez de piernas o fatiga ≥7/10, se traslada al sábado. Pruebas de comparación: tempo 25' (viernes) y rodaje a FC ~130. Pendiente de hablar con Miguel: estímulo de VO2 puntual (5x3' o 6x800) en lugar de una sesión de calidad y vídeo lateral de técnica. Jueves 29 oct: descanso, Gym B trasladado al sábado. Viernes 30 oct: tempo 25' hecho a 5'29'' de media con FC 141→150 (máx 153) y progresión por bloques de 5' (5'40'' → 5'13''); ref. 2 oct 20' a 5'34'' FC 147. El largo del domingo se queda en 55-60 min sin tramo final rápido por el aviso dorsal del 28 oct.`,
  lastUpdate:`30 oct 2026 — Tempo 25' hecho (5'29'' medio, FC 141→150, máx 153; progresión 5'40''→5'13''). Jueves descanso; Gym B trasladado al sábado.`,
  weekDays: [
    {name:`Lun`,type:`Descanso`,detail:`Descanso completo. Referencia para la calidad de la semana: tempo continuo (2 oct: 20' a 5'34''/km, FC 147).`,result:``,status:`pending`,adjust:`Descanso tras una semana completa (6 sesiones, la última de 62 min con cuádriceps cargados en las cuestas). Foam roller suave en cuádriceps y dorsal si hay tensión.`,adjustDetail:[{ejercicio:`Sin sesión`,series:`—`,nota:`Descanso completo. Movilidad torácica opcional 10 min.`}]},
    {name:`Mar`,type:`Gym A`,detail:`Movilidad torácica 8 min · 1 Press banca Smith 4x8 (39kg) · 2 Press militar 4x10 (10kg/mano) · 3 Jalón 4x10 (40,5kg) · 4 Remo polea 3x10 (25kg) · 5 Búlgara 3x8/lado (8kg/mano) · 6 Curl 3x10 (8kg) · 7 Pallof 3x12/lado (11,5kg) · 8 Press de pierna 4x10 (25kg/lado + 75,7kg de resistencia) · 9 Plancha lateral 3x40s/lado · Foam roller dorsal.`,result:`Gym A hecho (Strava, 75 min, ER 10, 380 kcal, FC media 87, máx 129), todos los ejercicios, en el orden de Strava: 1 Press banca Smith 4x8 · 39kg ↑ (32/32 ✔; el 20 oct 38kg) · 2 Press militar 4x10 · 10kg/mano ✔ · 3 Jalón 4x10 · 40,5kg ✔ · 4 Remo polea 3x10 · 25kg ✔ (3 series, como estaba previsto; el 20 oct fueron 4) · 5 Búlgara 3x8/lado · 8kg/mano ✔ (Strava suma 16kg) · 6 Curl 3x10 · 8kg ✔ (3 series limpias) · 7 Pallof 3x12 · 11,5kg ✔ · 8 Press de pierna 4x10 · 25kg por lado + 75,7kg de resistencia inicial, la misma carga que el 20 oct (Strava registra 100kg, dato erróneo) · 9 Plancha lateral 3x40s ✔.`,status:`done`,adjust:`Segundo Gym A completo con pierna, con todos los ejercicios y en menos tiempo que el del 20 oct (75 vs 79 min). Banca sube 1kg sobre los 38kg del 20 oct con las 4x8 completas. Curl: 3x10 limpias con 8kg, cumple el criterio para pasar a 10kg en el próximo Gym A (empezando por la izquierda y sin balanceo). Remo en 3 series, como estaba previsto, para cuidar el dorsal. Press de pierna con la misma carga que el 20 oct (25kg por lado + 75,7kg de resistencia): 4x10 completas, sin subir; +2,5kg por lado en el próximo Gym A si salen limpias y las piernas están sueltas.`,adjustDetail:[{ejercicio:`1 · Movilidad torácica`,series:`8 min al inicio`,nota:`Obligatorio (no queda registrado en Strava).`},{ejercicio:`2 · Press banca Smith`,series:`4x8 · 39kg ↑`,nota:`Hecho, 32/32. Siguiente: 40kg 4x8 si el esfuerzo fue controlado.`},{ejercicio:`3 · Press militar`,series:`4x10 · 10kg/mano`,nota:`Hecho. Sin subir.`},{ejercicio:`4 · Jalón`,series:`4x10 · 40,5kg`,nota:`Hecho. Sin subir.`},{ejercicio:`5 · Remo polea sentado`,series:`3x10 · 25kg`,nota:`Hecho en 3 series. Vigilar entre escápulas.`},{ejercicio:`6 · Búlgara`,series:`3x8/lado · 8kg/mano`,nota:`Hecho (Strava suma 16kg).`},{ejercicio:`7 · Curl mancuernas`,series:`3x10 · 8kg`,nota:`3x10 limpias. Próximo Gym A: 10kg, empezando por la izquierda.`},{ejercicio:`8 · Pallof press`,series:`3x12/lado · 11,5kg`,nota:`Hecho.`},{ejercicio:`9 · Press de pierna`,series:`4x10 · 25kg/lado + 75,7kg de resistencia`,nota:`Misma carga que el 20 oct, 4x10 hechas. Próximo: +2,5kg por lado si salen limpias.`},{ejercicio:`10 · Plancha lateral`,series:`3x40s/lado`,nota:`Hecho.`},{ejercicio:`Estiramientos + foam roller dorsal`,series:`10 min`,nota:`Obligatorio.`}]},
    {name:`Mié`,type:`Rodaje Z2`,detail:`45-50 min continuo · 6'15''-6'30''/km · FC <135bpm (135-137 aceptable en Retiro) · Protocolo de movilidad dorsal 5 min antes · Techo 70 min.`,result:`Rodaje hecho (Huawei + Strava): 6,89km · 44:46 · 6'30''/km · FC media 130 (máx 143) · ascenso 76m / descenso 77m · cadencia 163ppm · zancada 94cm · contacto 299ms · oscilación vertical 9,8cm · equilibrio 50,8/49,2 · carga aeróbica 2,5 · VO2max Huawei 45 · recuperación 15h · 19°C. Los primeros ~2,7km suben (+60m) y el resto baja o es llano: FC 136-137 en los km 2-3 y 130-131 en los km 4-6; km 1 lento (~7'17'', con parada inicial y subida) y después 6'28''-6'45''. Sin deriva de FC. Molestia dorsal leve en los primeros 100-200m que desapareció al ajustar la pisada; sin cansancio durante ni después.`,status:`done`,adjust:`Rodaje de recuperación correcto: 6'30'' en el extremo lento del rango, FC por debajo de 135 casi todo el recorrido y 44'46'' (justo en el límite bajo de 45-50 min). Con 76m de desnivel y tras el Gym A, el ritmo es el adecuado. Lo relevante es la molestia dorsal inicial: desaparece al cambiar la pisada y no deja tensión posterior, pero al ser dorsal se trata con máxima precaución: sin progresiones esta semana, movilidad torácica antes de cada sesión y vigilar el jueves por la mañana. Si reaparece en frío o después de correr, se para y se valora con el fisio.`,adjustDetail:[{ejercicio:`Protocolo movilidad dorsal`,series:`5 min pre-rodaje`,nota:`Obligatorio. Hoy la molestia apareció en los primeros 100-200m.`},{ejercicio:`Trote continuo`,series:`44'46'' · 6'30''/km · FC 130bpm`,nota:`FC <135 casi todo el recorrido. Picos 136-143 en la subida inicial.`},{ejercicio:`Pisada y postura`,series:`Cadencia 163 · contacto 299ms · 9,8cm`,nota:`La molestia dorsal desapareció al ajustar la pisada: anotar qué cambiaste (zancada, inclinación, hombros).`},{ejercicio:`Estiramientos post-rodaje`,series:`10 min`,nota:`Gemelo, isquio, cuádriceps, cadera.`}]},
    {name:`Jue`,type:`Descanso (Gym B trasladado al sábado)`,detail:`Descanso completo. Gym B trasladado al sábado para llegar más fresco al tempo del viernes.`,result:`Descanso, confirmado por Miguel. Gym B trasladado al sábado.`,status:`done`,adjust:`Descanso tras el rodaje del miércoles con la molestia dorsal inicial (resuelta al ajustar la pisada). Mismo patrón que en S6: jueves libre, calidad el viernes y Gym B el sábado.`,adjustDetail:[{ejercicio:`Sin sesión`,series:`—`,nota:`Descanso completo.`}]},

ramientos y foam roller dorsal después.`}]},

        {name:`Jue`,type:`Rodaje Z2 (cinta) + Gym A superior`,detail:`Sesión doble: rodaje corto en cinta y Gym A solo de tren superior.`,result:`Rodaje cinta: 6,23km · 43:20 · 6'57''/km · FC 126bpm (máx 141bpm) · ER 31 · cadencia 79ppm. Gym A superior (19:54): 27:35 · ER 6. Press militar 10kg/mano 4x10 (40/40 ✔, primera vez completo) · Jalón 40,5kg 3x10 · Remo polea 25kg 4x12 · Tríceps polea 13,5kg 4x10 · Face pull 12kg 4x10. NO realizado: press banca, curl, hexagonal, búlgara, Pallof ni plancha lateral.`,status:`modified`,adjust:`Rodaje más lento que el rango (6'15''-6'30'') con FC 7ppm por encima de la cinta del 7 oct (6'48'' FC 119): posible fatiga/estrés de la semana. Militar completa 40/40 y remo sube a 4x12, pero faltan banca (test de 39kg) y pierna: pasan a S6.`,adjustDetail:[{ejercicio:`Rodaje cinta`,series:`43 min · 6'57''/km · FC 126bpm`,nota:`Z2, pero FC alta para el ritmo.`},{ejercicio:`Press militar`,series:`4x10 · 10kg/mano (40/40)`,nota:`Listo para progresar: 11-12kg con 3x8 o 10kg 4x12.`},{ejercicio:`Remo polea`,series:`4x12 · 25kg`,nota:`Mucho volumen de tirón: vigilar dorsal.`},{ejercicio:`Press banca / Pierna / Core`,series:`No realizados`,nota:`Recuperar en S6.`}]},
        {name:`Vie`,type:`Fartlek piramidal`,detail:`Calentamiento · Pirámide 30''-1'-2'-3'-4'-3'-2'-1'-30'' con recuperación de 1' trotando (30'' tras los esfuerzos de 30'') · Enfriamiento.`,result:`Pirámide Farlek hasta 4' (segmentos Huawei): 7,45km · 45:17 · 6'05''/km · FC media 142bpm (máx 163bpm) · ascenso 56m · 27°C. Esfuerzos: 30'' 4'30'' (FC 136) · 1' 5'00'' (148) · 2' 5'11'' (147) · 3' 5'19'' (149) · 4' 5'19'' (153) · 3' 5'29'' (151) · 2' 4'57'' (154) · 1' 4'47'' (152) · 30'' 4'48'' (151). Bloque de 25': 17' de esfuerzo a 5'11''/km medio (FC ≈150) y 8' de recuperación a 7'37''/km (FC ≈148: la FC casi no baja entre esfuerzos). Enfriamiento 5:17 a 6'19'' (FC 136). Cadencia 166ppm · contacto 280ms · equilibrio 50,9/49,1. Huawei: carga aeróbica 3,2 · anaeróbica 1,2. Piernas bien, sin pesadez.`,status:`done`,adjust:`Primera pirámide del Q4 (la del 15 sep no se hizo): queda como referencia. Ritmos por encima de lo marcado en los tramos cortos (30'' 4'30'', 2' 4'57'', 1' 4'47''), dentro de rango en 1'-4' ascendentes y el 3' descendente (5'29'') fue el más flojo, coherente con calor (27°C) y acumulación. FC alta (pico 163, por encima del tope de 160 marcado), explicable por calor y recuperaciones cortas. Protocolo de recuperación: se mantiene el de Miguel (1' y 30'' tras 30''), que mantiene la FC cerca de la de 10K (Zara 146).`,adjustDetail:[{ejercicio:`Esfuerzos ascendentes`,series:`30'' 4'30'' · 1' 5'00'' · 2' 5'11'' · 3' 5'19'' · 4' 5'19''`,nota:`FC 136→153. Dentro de rango.`},{ejercicio:`Esfuerzos descendentes`,series:`3' 5'29'' · 2' 4'57'' · 1' 4'47'' · 30'' 4'48''`,nota:`FC 151-154. El 3' flojo; final fuerte.`},{ejercicio:`Recuperaciones`,series:`1' a 7'03''-8'16''/km · FC 143-153`,nota:`La FC no baja: bloque continuo a ≈149bpm durante 25'.`},{ejercicio:`Criterio con calor`,series:`≥25°C`,nota:`Juzgar por ritmo y sensaciones; FC +5-8ppm. Tope práctico: pico 163, recuperación sin pasar de 155.`}]},
        {name:`Sáb`,type:`Gym B (recortado)`,detail:`Gym B con pierna recortada: step down 3 series, sin subir swing ni farmer.`,result:`Gym B hecho (Strava, ~60 min, ER 10): 1 Swing KB 4x15 · 20kg ✔ · 2 Step down 3x8 · 5kg/mano ✔ (Strava suma 10kg por las dos mancuernas) · 3 Remo unilateral 3x12 · 16kg ✔ · 4 Press pecho polea 1 brazo 4x10 · 11,5kg ↓ (previsto 12,5kg: no pudo con el marcado) · 5 Farmer carry 4x30 · 20kg ✔ · 6 Face pull 3x12 · 11,5kg ✔ · 7 Gemelo unilateral 3x15 ✔ · 8 Pallof 3x12 · 11,5kg ✔ · 9 Plancha lateral 40s: 2 series (confirmado por Miguel; previstas 3). Orden en Strava: press de pecho tras la plancha lateral (distinto al programado, por confirmar).`,status:`done`,adjust:`Sesión completada como estaba programada salvo el press de pecho (11,5kg ↓ en vez de 12,5kg): la subida no se sostiene todavía; se repite 11,5kg y se sube cuando salgan las 4x10 limpias. Step down 2x5kg ejecutado sin molestias reportadas. Después, el rodaje del domingo salió con FC normal (130).`,adjustDetail:[{ejercicio:`1 · Movilidad torácica`,series:`8 min al inicio`,nota:`Obligatorio (no queda registrado en Strava).`},{ejercicio:`2 · Swing KB`,series:`4x15 · 20kg`,nota:`Hecho. Sin subir de peso.`},{ejercicio:`3 · Step down`,series:`3x8/pierna · 5kg/mano ↓ (4 series el plan normal)`,nota:`Hecho. Excéntrico 3s. NO step up ni cajón.`},{ejercicio:`4 · Remo unilateral`,series:`3x12/brazo · 16kg ↓`,nota:`Hecho.`},{ejercicio:`5 · Press pecho polea 1 brazo`,series:`4x10/lado · 11,5kg ↓ (previsto 12,5kg)`,nota:`Ajuste de peso. Repetir 11,5kg antes de volver a subir.`},{ejercicio:`6 · Farmer carry`,series:`4x30m · 20kg`,nota:`Hecho (Strava: 4x30s). Sin subir.`},{ejercicio:`7 · Face pull`,series:`3x12 · 11,5kg`,nota:`Hecho. Salud escapular.`},{ejercicio:`8 · Gemelo unilateral`,series:`3x15/pierna`,nota:`Hecho.`},{ejercicio:`9 · Pallof press`,series:`3x12/lado · 11,5kg`,nota:`Hecho.`},{ejercicio:`10 · Plancha lateral`,series:`3x40s/lado previstas · hechas 2`,nota:`Confirmado: 2 series.`},{ejercicio:`Estiramientos + foam roller dorsal`,series:`5-8 min`,nota:`Obligatorio.`}]},
        {name:`Dom`,type:`Rodaje tranquilo`,detail:`45-50 min · 6'25''-6'40''/km · FC <133bpm (55-60 min si el sábado fue descanso).`,result:`Rodaje (Huawei + Strava): 8,51km · 54:25 (58:54 totales con paradas) · 6'24''/km · FC media 130bpm (Strava 131; máx 138) · ascenso 68,5m / descenso 80,1m · cadencia 165ppm · zancada 95cm · contacto 271ms · oscilación vertical 9,4cm · equilibrio 51,4/48,6 · carga aeróbica 2,7 · recuperación 14h · VO2max Huawei 45. Km de ~6'50'' a ~6'03'': la mejora del último km es del terreno (en Retiro los primeros km suben y la vuelta baja, sobre todo el último), no una progresión intencionada. FC tras parar: 140→88 en 2'. Día nublado, sin calor. Fatiga 6-7/10: cansancio general (ni dorsal ni piernas).`,status:`done`,adjust:`Rodaje unos 5 min más largo que lo previsto (54 vs 45-50) y 6'24'' en el borde rápido del rango, con FC 130 dentro de lo marcado (<133). Misma eficiencia que el rodaje del 11 oct (6'23'' FC 129) pero con +70m de desnivel y tras fartlek + Gym B: no hay fatiga aeróbica visible. VO2max estimado vuelve a 45 con el día fresco. El último km a ~6'03'' se explica por el terreno favorable (bajada), no por soltarse.`,adjustDetail:[{ejercicio:`Protocolo movilidad dorsal`,series:`5 min pre-rodaje`,nota:`Obligatorio (no queda registrado en Strava).`},{ejercicio:`Trote continuo`,series:`54 min · 6'24''/km · FC 130bpm`,nota:`FC dentro de lo marcado (<133). Ritmo en el borde rápido del rango.`},{ejercicio:`Equilibrio y contacto`,series:`51,4/48,6 · 271ms · 9,4cm`,nota:`Asimetría leve habitual (firma 51/49). Vigilar con fatiga y desnivel.`},{ejercicio:`Técnica (vídeo frontal 1,9 s)`,series:`Hombros relajados · tronco erguido · sin cruce de pies`,nota:`Valoración parcial. Falta vídeo lateral (10-15 s, a la altura de la cadera, 60 fps) al inicio y tras 6-7 km para ver postura dorsal y pisada.`},{ejercicio:`Estiramientos post-rodaje`,series:`10 min`,nota:`Gemelo, isquio, cuádriceps, cadera.`}]},
       ],notes:`Semana 5 del plan Q4 (desarrollo) cerrada: semana condicionada por trabajo, sin entrenar hasta el jueves 15 oct (rodaje corto en cinta + Gym A solo tren superior: militar 40/40 con 10kg, jalón 40,5kg, remo 25kg 4x12). Viernes: fartlek piramidal con 27°C (7,45km, esfuerzos a 5'11''/km medio con FC ≈150; referencia del Q4 con recuperaciones de 1'). Sábado: Gym B recortado (único ajuste, press pecho polea 11,5kg ↓; plancha lateral 2 series). Domingo: rodaje tranquilo de 8,5km a 6'24'' con FC 130 y +70m, igual que el del 11 oct. VO2max Huawei 44 (fartlek con calor) → 45 (rodaje fresco). Fatiga 6-7/10 por cansancio general y agujetas de isquios/aductores el lunes. Pierna de Gym A sin cargar por tercera semana seguida: retomar en S6. Sin incidencias dorsales.`},

    {name:`Mar`,type:`Gym A`,detail:`Movilidad torácica 8 min · 1 Press banca Smith 4x8 (39kg) · 2 Press militar 4x10 (10kg/mano) · 3 Jalón 4x10 (40,5kg) · 4 Remo polea 3x10 (25kg) · 5 Press de pierna 4x10 (en vez de hexagonal) · 6 Búlgara 3x8/lado (8kg/mano) · 7 Curl 3x10 · 8 Pallof 3x12/lado (11,5kg) · 9 Plancha lateral 3x40s/lado · Foam roller dorsal.`,result:`Gym A hecho (Strava, 79 min, ER 13, 453 kcal): 1 Press banca Smith 4x8 · 38kg ↓ (32/32 ✔, test superado; previsto 39kg) · 2 Press militar 4x10 · 10kg/mano ✔ · 3 Jalón 4x10 · 40,5kg ✔ · 4 Remo polea 4x10 · 25kg (una serie más de las 3 previstas) · 5 Pallof 3x12 · 11,5kg (Strava lo coloca antes de la pierna) · 6 Press de pierna 4x10 reales (Strava registra 4x8) · máquina nueva de discos: 25kg por lado + 75,7kg de resistencia inicial = ~126kg · 7 Búlgara 3x8/lado · 8kg/mano ✔ (Strava suma 16kg) · 8 Curl 12kg x10 → 8kg ↓ x10 → 8kg ↓ x10 (12kg casi no sale en la primera serie, sobre todo con la izquierda) · 9 Plancha lateral 3x40s/lado ✔. Rodilla izquierda e isquios bien tras la sesión.`,status:`done`,adjust:`Primer Gym A con pierna en 4 semanas, completado sin molestias en rodilla izquierda ni isquios. Test de banca superado: 4x8 completas con 38kg (con 41kg se perdían repeticiones en las series 3-4). Press de pierna en máquina nueva (discos, resistencia inicial 75,7kg): con 25kg por lado el esfuerzo fue similar al de septiembre en la máquina anterior (55-65kg). Curl: 12kg está por encima de la fuerza actual (8-8-6 y 10-9-8 repeticiones en septiembre; hoy casi no sale, sobre todo con la izquierda), así que se baja a 8kg para progresar desde ahí. Remo con 4 series: vigilar tensión entre escápulas.`,adjustDetail:[{ejercicio:`1 · Movilidad torácica`,series:`8 min al inicio`,nota:`Obligatorio (no queda registrado en Strava).`},{ejercicio:`2 · Press banca Smith`,series:`4x8 · 38kg ↓ (previsto 39kg)`,nota:`Test superado, 32/32. Siguiente: 39-40kg 4x8 (propuesta).`},{ejercicio:`3 · Press militar`,series:`4x10 · 10kg/mano`,nota:`Hecho. Sin subir.`},{ejercicio:`4 · Jalón`,series:`4x10 · 40,5kg`,nota:`Hecho. Sin subir.`},{ejercicio:`5 · Remo polea sentado`,series:`4x10 · 25kg (previstas 3)`,nota:`Una serie extra. Vigilar dorsal.`},{ejercicio:`6 · Press de pierna (en vez de hexagonal)`,series:`4x10 · 25kg/lado + 75,7kg de resistencia inicial = ~126kg`,nota:`Máquina nueva de discos. Equivalencia por sensación: esfuerzo similar a 55-65kg de la máquina de septiembre. Strava registra 50kg x8 (dato erróneo). Siguiente: 52,5kg por lado si salen limpias (propuesta).`},{ejercicio:`7 · Búlgara`,series:`3x8/lado · 8kg/mano`,nota:`Hecho (Strava suma 16kg). Rodilla izquierda bien.`},{ejercicio:`8 · Curl mancuernas`,series:`3x10 · 12kg x10 → 8kg ↓ x10 → 8kg ↓ x10`,nota:`12kg casi no sale, sobre todo con la izquierda. Progresar desde 8kg: 10kg cuando salgan 3x10 limpias; empezar por el brazo izquierdo y sin balanceo.`},{ejercicio:`9 · Pallof press`,series:`3x12/lado · 11,5kg`,nota:`Hecho.`},{ejercicio:`10 · Plancha lateral`,series:`3x40s/lado`,nota:`Hecho.`},{ejercicio:`Estiramientos + foam roller dorsal`,series:`10 min`,nota:`Obligatorio.`}]},
    {name:`Mié`,type:`Rodaje Z2`,detail:`45-50 min continuo · 6'15''-6'30''/km · FC <135bpm (135-137 aceptable en Retiro) · Protocolo de movilidad dorsal 5 min antes · Techo 70 min.`,result:`Rodaje hecho (Huawei + Strava): 6,90km · 45:44 · 6'38''/km · FC media 134bpm (Strava 135; máx 142) · ascenso 69m / descenso 73m · cadencia 163ppm · zancada 92cm · contacto 297ms · oscilación vertical 9,6cm · equilibrio 50,0/50,0 · carga aeróbica 2,8 · VO2max Huawei 45. Parciales: 7'33'' (+32m, FC 131) · 6'43'' · 6'55'' · 6'22'' · 6'34'' · 6'29''. Los tres primeros km suben y los tres últimos bajan (Retiro). Primeros km incómodos hasta entrar en calor; ritmo frenado a propósito para mantener la FC en rango. Deriva de FC casi nula (134,6 → 135,5 entre mitades). A ritmo similar en llano la FC fue ~6-7 lpm mayor que el 18 oct (129-130): cansancio residual del Gym A, sin molestias reportadas.`,status:`done`,adjust:`Rodaje de recuperación tras el Gym A con pierna: si las piernas vienen pesadas, quedarse en el extremo lento del rango (6'30''). Referencia para comparar: 6'23''-6'24''/km a FC 129-130 (11 y 18 oct). En Retiro los primeros km suben y la vuelta baja: el ritmo del último km no es una progresión.`,adjustDetail:[{ejercicio:`Protocolo movilidad dorsal`,series:`5 min pre-rodaje`,nota:`Obligatorio.`},{ejercicio:`Trote continuo`,series:`45-50 min · 6'15''-6'30''/km`,nota:`FC <135bpm. Nunca superar 70 min.`},{ejercicio:`Estiramientos post-rodaje`,series:`10 min`,nota:`Gemelo, isquio, cuádriceps, cadera.`}]},

    {name:`Vie`,type:`Series 4x1K`,detail:`Protocolo dorsal 5 min · Calentamiento 10 min · 4x1K a 5'10''-5'20''/km · Recuperación 2' trotando suave · Enfriamiento 10 min.`,result:`Series hechas (Huawei + Strava): 8,37km · 51:59 · FC media 139 (máx 161) · carga aeróbica 3,3 / anaeróbica 1,5 · VO2max 45 · cadencia 162 (series 172-174) · zancada 99cm (series ~112) · contacto 272ms · oscilación 9,9cm · equilibrio 51,1/48,9. 4x1K: 5'07'' (FC 146) · 5'06'' (151) · 5'08'' (153) · 5'14'' (152), rec. 2' trotando (FC media de recuperación 126-133). Media 5'09'' a FC ~151 (10 oct: 5'17'' a FC ~146). Salida más rápida que el rango previsto (5'10''-5'20''): la FC se estabilizó en 151-153 desde la 2ª serie y la 4ª cayó a 5'14'' con la misma FC. Recuperación de FC (Strava): -28 a -32 lpm a los 60 s y -36 a -42 a los 90 s, estable de la serie 1 a la 4. Buenas sensaciones en general; última serie muy costosa, sin poder forzar. Sin molestias reportadas.`,status:`done`,adjust:`Repetición de la referencia del 10 oct (4x1K a 5'14''-5'20'', 5'17'' medio, FC 144→148; rec. 2' con FC a 60 s ≈109-117). Lo que cuenta es la FC al mismo ritmo, no el ritmo. Pico de FC <160; si en la 3ª o 4ª serie no se sostiene el ritmo, terminar ahí. Mejor por la mañana y sin calor; con ≥25°C se juzga por ritmo y sensaciones. Si el viernes la fatiga sigue en ≥7/10 o la FC de rodaje sigue alta, se cambia por tempo corto de 15-20' (referencia 5'34'' a FC 147) en lugar de forzar las series.`,adjustDetail:[{ejercicio:`Calentamiento`,series:`10 min suaves`,nota:`Protocolo dorsal 5 min antes.`},{ejercicio:`Series 1K`,series:`4x1000m · 5'10''-5'20''/km`,nota:`Referencia 5'17'' a FC 145. Pico <160.`},{ejercicio:`Recuperación`,series:`2' trotando suave`,nota:`Anotar FC a los 60 s (ref. 109-117).`},{ejercicio:`Enfriamiento`,series:`10 min`,nota:`Estiramientos y foam roller dorsal después.`}]},
    {name:`Sáb`,type:`Gym B`,detail:`Movilidad torácica 8 min · 1 Swing KB 4x15 (20kg) · 2 Step down 3x8/pierna (5kg/mano) · 3 Remo unilateral 3x12/brazo (16kg) · 4 Gemelo unilateral 3x15/pierna · 5 Farmer carry 4x35s (20kg) · 6 Plancha lateral 3x40s/lado · 7 Press pecho polea 1 brazo 4x10/lado (11,5kg) · 8 Face pull 3x12 (11,5kg) · 9 Tríceps polea 3x12 (13,5kg) · 10 Pallof 3x12/lado (11,5kg) · Foam roller dorsal.`,result:`Hecho sin problemas, 65 min, 24 h después de las series. Orden real (el habitual por zonas de gimnasio): swing, step down, remo, gemelo, farmer, plancha lateral, press, face pull, tríceps. Cargas sin subir salvo farmer 30→35 s y plancha lateral 3 series. Press de pecho 4x10 con 11,5kg completo. Tríceps polea 13,5kg: la última serie fue fallo. Pallof press no realizado (olvido): recuperarlo en el próximo Gym B o añadirlo al final de Gym A.`,status:`done`,adjust:`Gym B trasladado del jueves al sábado, 24 h después de las series. Cargas como el 17 oct: sin subir swing ni farmer; step down 3x8 con 5kg/mano (no 4 series). Press de pecho: repetir 11,5kg y subir a 12,5kg cuando salgan las 4x10 limpias. Si hay pesadez de piernas o fatiga ≥7/10, versión reducida (swing 3x15, step down 2x8).`,adjustDetail:[{ejercicio:`1 · Movilidad torácica`,series:`8 min al inicio`,nota:`Obligatorio.`},{ejercicio:`2 · Swing KB`,series:`4x15 · 20kg`,nota:`No subir de peso.`},{ejercicio:`3 · Step down`,series:`3x8/pierna · 5kg/mano`,nota:`Excéntrico 3s. NO step up ni cajón.`},{ejercicio:`4 · Remo unilateral`,series:`3x12/brazo · 16kg`,nota:`Tirón controlado.`},{ejercicio:`5 · Gemelo unilateral`,series:`3x15/pierna`,nota:`Sóleo y gemelo.`},{ejercicio:`6 · Farmer carry`,series:`4x35s · 20kg`,nota:`Hecho: 35 s.`},{ejercicio:`7 · Plancha lateral`,series:`3x40s/lado`,nota:`Peso corporal.`},{ejercicio:`8 · Press pecho polea 1 brazo`,series:`4x10/lado · 11,5kg`,nota:`4x10 limpias: próximo Gym B probar 12,5kg.`},{ejercicio:`9 · Face pull`,series:`3x12 · 11,5kg`,nota:`Salud escapular.`},{ejercicio:`10 · Tríceps polea`,series:`3x12 · 13,5kg`,nota:`Fallo en la última serie: mantener 13,5kg.`},{ejercicio:`11 · Pallof press`,series:`3x12/lado · 11,5kg`,nota:`No realizado (olvido). Recuperar en el próximo Gym B.`},{ejercicio:`Estiramientos + foam roller dorsal`,series:`5-8 min`,nota:`Obligatorio.`}]},
    {name:`Dom`,type:`Rodaje largo`,detail:`55-60 min continuo · 6'15''-6'30''/km · FC <135bpm (137 aceptable en Retiro) · Techo absoluto 70 min inamovible.`,result:`Rodaje largo hecho (Huawei + Strava): 10,02km · 1:02:03 · 6'14''/km (Strava en movimiento 6'19'') · FC media 131 (Strava 132; máx 146) · ascenso 76m (Strava 88) / descenso 74m · cadencia 166ppm · zancada 96cm · contacto 290ms · oscilación vertical 9,6cm · equilibrio 49,9/50,1 · VO2max Huawei 45 · recuperación 17h · FC tras parar 131→93. Km más rápido 5'51'' (tramo favorable); máx. de ritmo 4'16''. Recorrido: primeros 4 km en subida y el resto compensado con tramos favorables y algunos repechos. FC estable en 130-137 casi todo el recorrido, con picos de 138-146 solo en repechos a partir del km 6. Sin deriva de FC. Buenas sensaciones: cómodo de ritmo y respiración, piernas bien; cuádriceps algo cargados en las subidas desde el km 6. Sin molestias dorsales reportadas.`,status:`done`,adjust:`Largo de 62 min (dentro del rango de 55-60 más un margen, techo 70), con la FC en Z2 y el ritmo en el borde rápido del rango (6'14'' vs 6'15''-6'30''). Comparado con el rodaje del 18 oct (6'24'' a FC 129-130) y el del 21 oct (6'38'' a FC 134): más ritmo con FC parecida, aunque el terreno no es idéntico (+76m aquí), y sin deriva ni fatiga aeróbica visible 48 h después del Gym B y 72 h después de las series. Los cuádriceps cargados en las cuestas desde el km 6 son lo esperado tras el step down excéntrico del sábado: no son una señal de alarma si desaparecen en 24-48 h. El km a 5'51'' y el final rápido se explican por el terreno, no por progresión.`,adjustDetail:[{ejercicio:`Protocolo movilidad dorsal`,series:`5 min pre-rodaje`,nota:`Obligatorio.`},{ejercicio:`Trote continuo`,series:`62 min · 6'14''/km · FC 131bpm`,nota:`FC por debajo de 135 casi todo el recorrido. Picos 138-146 solo en repechos.`},{ejercicio:`Equilibrio y contacto`,series:`49,9/50,1 · 290ms · 9,6cm`,nota:`Simetría casi perfecta hoy. Contacto algo mayor que otros días (271-297).`},{ejercicio:`Estiramientos post-rodaje`,series:`10 min`,nota:`Gemelo, isquio, cuádriceps, cadera.`}]},

function kindOf(d){
  const t=(d.type||'');
  if(/^(Descanso|Sin sesi)/i.test(t))return 'rest';
  if(/gym/i.test(t))return 'gym';
  return 'run';
}
function dayIsRest(d){return /^(Descanso|Sin sesi)/i.test(d.type||'')}
function dayIsDone(d){return d.status==='done'||(d.status==='modified'&&d.result&&!/^Sin sesi/i.test(d.result))}
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DOWFULL={Lun:'Lunes',Mar:'Martes','Mié':'Miércoles',Jue:'Jueves',Vie:'Viernes','Sáb':'Sábado',Dom:'Domingo'};
const DOWLET={Lun:'L',Mar:'M','Mié':'X',Jue:'J',Vie:'V','Sáb':'S',Dom:'D'};
function todayIdx(days){if(DATA.weekStart){const k=-daysUntil(DATA.weekStart);return k>=0&&k<days.length?k:-1}const n=DOW[new Date().getDay()];return days.findIndex(d=>d.name===n)}
function daysUntil(iso){const [y,m,d]=iso.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/86400000)}

// ── ANILLO SEGMENTADO ──────────────────────────────────────────────────
function polar(cx,cy,r,a){const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
function arcPath(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1);const large=(a1-a0)>180?1:0;return `M${p0[0].toFixed(2)} ${p0[1].toFixed(2)}A${r} ${r} 0 ${large} 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)}`}
function segRing(segs,size,sw,flat){
  const n=segs.length||1,c=size/2,r=c-sw/2-1,gap=n>1?Math.min(14,360/n*0.28):0,span=360/n;
  const colors={run:'#F5B300',gym:'#9A8FFF',pending:'rgba(127,160,152,.35)'};
  let out='';
  segs.forEach((s,i)=>{
    const a0=i*span+gap/2,a1=(i+1)*span-gap/2;
    const len=(Math.PI*r*2*(a1-a0)/360).toFixed(1);
    out+=`<path d="${arcPath(c,c,r,a0,a1)}" fill="none" stroke="${flat?colors[s.k]:''}" stroke-width="${sw}" stroke-linecap="round" ${flat?'':`class="ring-seg ${s.k==='pending'?'pending':s.k} draw" style="--len:${len};--i:${i}"`}/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${flat?size:'100%'}" height="${flat?size:'100%'}" aria-hidden="true">${out}</svg>`;
}

function stepsHTML(detail){
  return detail.split(' · ').map(x=>x.trim()).filter(Boolean).map(t=>{
    const m=t.match(/^(\d+)\s+(.*)$/);
    let body=(m?m[2]:t).replace(/(\d+x\d+(?:K|\s?[ms]\b)?(?:\/[A-Za-zÁ-ú]+)?)/,'<b class="rx">$1</b>');
    if(!/class="rx"/.test(body))body=body.replace(/(\d+'\d\d''(?:-\d+'\d\d'')?\/km|FC\s*&lt;?<?\s*\d+\s*bpm|\d+(?:-\d+)?\s*min(?=\s|$))/,'<b class="rx">$1</b>');
    return `<li><span class="n">${m?m[1]:'•'}</span><span class="t">${body}</span></li>`;
  }).join('');
}

}

// ── GRÁFICO DE LÍNEA (SVG propio, sin dependencias) ────────────────────
function lineChart(labels,real,est,goal,min,max){
  const W=360,H=230,L=40,R=30,T=18,B=30,iw=W-L-R,ih=H-T-B,n=labels.length;
  const X=i=>L+(n>1?i*iw/(n-1):iw/2),Y=v=>T+(v-min)/(max-min)*ih;
  const ticks=[];for(let v=Math.ceil(min*2)/2;v<=max;v+=0.5)ticks.push(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del ritmo en 10K: real, proyección y objetivo">`;
  ticks.forEach(v=>{s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax-t" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${paceStr(v)}</text>`});
  labels.forEach((l,i)=>{s+=`<text class="ax-t" x="${X(i)}" y="${H-9}" text-anchor="middle">${l}</text>`});
  s+=`<line class="ln-goal" x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}"/><text class="goal-t" x="${L+4}" y="${Y(goal)-7}">Objetivo ${paceStr(goal)}/km</text>`;
  const rp=[],ep=[];real.forEach((v,i)=>{if(v!=null)rp.push([X(i),Y(v),v])});est.forEach((v,i)=>{if(v!=null)ep.push([X(i),Y(v),v])});
  if(ep.length&&rp.length)ep.unshift(rp[rp.length-1]);
  const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  if(ep.length>1)s+=`<path class="ln-est" d="${path(ep)}"/>`;
  if(rp.length>1)s+=`<path class="ln-real" d="${path(rp)}"/>`;
  rp.forEach(q=>{s+=`<circle class="dt-real" cx="${q[0]}" cy="${q[1]}" r="5.5"/><text class="pt-t" x="${q[0]}" y="${q[1]-12}">${paceStr(q[2])}</text>`});
  ep.slice(rp.length?1:0).forEach(q=>{s+=`<circle class="dt-est" cx="${q[0]}" cy="${q[1]}" r="5"/><text class="pt-t est" x="${q[0]}" y="${q[1]-12}">${paceStr(q[2])}</text>`});
  return s+'</svg>';
}

function buildDayCards(days,showResult,ctxId){
  const sc={done:'done',modified:'modified',pending:''};

  const sl={done:'Hecho',modified:'Ajustado',pending:'Pendiente'};
  const ti=ctxId==='sw'?todayIdx(days):-1;
  return `<div class="week-grid">${days.map((d,di)=>{
    const hasAdjust=d.adjust;
    const adjId=`adj-${ctxId||'w'}-${di}`;
    const expId=`exp-${ctxId||'w'}-${di}`;
    const resultText=d.result||'Pendiente';
    const resultClass=d.result?'day-comment':'day-comment pending';
    const rest=dayIsRest(d);
    const label=(rest&&d.status==='pending')?'Descanso':sl[d.status];
    const isToday=di===ti;
    return `<div class="day-card ${sc[d.status]}${isToday?' today':''}" role="button" tabindex="0" aria-expanded="false" onclick="toggleDayExpand('${expId}',event)" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();toggleDayExpand('${expId}',event)}">
      <div class="day-card-header">

          <div class="day-type">${d.type}</div>
          <div class="day-detail">${d.detail}</div>
        </div>
        <span class="day-expand-icon" id="icon-${expId}">›</span>
      </div>
      <div class="day-expanded" id="${expId}" onclick="event.stopPropagation()">
        <div class="day-detail-full">${d.detail}</div>
        ${showResult?`<div class="${resultClass}"><strong>Estado:</strong> ${resultText}</div>`:''}
        ${hasAdjust?`<div class="day-adjust-banner" onclick="toggleAdjust('${adjId}')">
          <span class="day-adjust-text">⚡ ${d.adjust}</span>
          <span class="day-adjust-toggle" id="tog-${adjId}">ver detalle ›</span>
        </div>
        <div class="day-adjust-detail" id="${adjId}">
          <table class="adjust-table">
            <thead><tr><th>Ejercicio</th><th>Series</th><th>Nota</th></tr></thead>
            <tbody>${d.adjustDetail.map(a=>`<tr class="${a.ejercicio.startsWith('ELIMINAR')?'adj-row-del':''}">
              <td>${a.ejercicio}</td><td style="font-family:var(--mono);white-space:nowrap">${a.series}</td><td>${a.nota}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`:''}
      </div>
      <div class="day-status"><span class="day-dot ${dc[d.status]}"></span>${label}</div>
    </div>`;
  }).join('')}</div>`;
}

// ── EXPANDABLE BLOCKS (shared by Histórico & Planificación) ────────────
function buildExpandableBlocks(blocks,showDoneOnly,filterBlockId,prefix){
  const btc={current:'var(--lift)',planned:'var(--pre)',maint:'var(--text3)',peak:'var(--run)',race:'var(--warn)'};
  const wsl={done:'ejecutada',current:'en curso',planned:'planificada'};
  const wsc={done:'ws-done',current:'ws-current',planned:'ws-planned'};
  let filtered=blocks;
  if(filterBlockId)filtered=blocks.filter(b=>b.id===filterBlockId);
  if(showDoneOnly)filtered=filtered.map(b=>({...b,weeks:b.weeks.filter(w=>w.status==='done'||w.status==='current')})).filter(b=>b.weeks.length>0);
  if(!filtered.length)return '<div class="no-results">No hay semanas que mostrar con los filtros seleccionados.</div>';
  return filtered.map((block,bi)=>`
    <div class="block-group">
      <div class="block-header" onclick="toggleBlock('${prefix}bg${bi}')">
        <div class="block-header-left">
          <span class="block-dot" style="background:${btc[block.type]||'var(--text3)'}"></span>
          <span class="block-name">${block.name}</span>
          <span class="block-meta">${block.period}</span>
        </div>
        <span class="block-chevron" id="chev-${prefix}bg${bi}">›</span>
      </div>
      <div class="block-body" id="${prefix}bg${bi}">
        ${block.weeks.map((week,wi)=>`
          <div class="week-group">
            <div class="week-header" onclick="toggleWeek('${prefix}wg${bi}-${wi}')">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="week-title">${week.label}</span>
                  <span class="week-status-badge ${wsc[week.status]}">${wsl[week.status]}</span>
                </div>
                <div class="week-obj">${week.dateStart} · <em>${week.objetivo}</em></div>
              </div>
              <span class="week-chevron" id="chev-${prefix}wg${bi}-${wi}">›</span>
            </div>
            <div class="week-body" id="${prefix}wg${bi}-${wi}">
              ${buildDayCards(week.days,true,`${prefix}b${bi}w${wi}`)}
              ${week.notes?`<div class="section-label" style="margin-top:12px">Notas del entrenador</div><div class="notes-box">${week.notes}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

const DOW_ORDER={Lun:0,Mar:1,'Mié':2,Jue:3,Vie:4,'Sáb':5,Dom:6};
function sortWeek(days){return days.map((d,i)=>[d,i]).sort((a,b)=>(DOW_ORDER[a[0].name]-DOW_ORDER[b[0].name])||(a[1]-b[1])).map(x=>x[0])}
function initApp(){
  DATA.weekDays=sortWeek(DATA.weekDays);
  DATA.blocks.forEach(b=>b.weeks.forEach(w=>{w.days=sortWeek(w.days)}));
  buildNav();
  try{renderSemana();}catch(e){console.error('renderSemana:',e);}
  try{renderProgresion();}catch(e){console.error('renderProgresion:',e);}
  try{renderCompeticiones();}catch(e){console.error('renderCompeticiones:',e);}
  try{renderHistorico();}catch(e){console.error('renderHistorico:',e);}
  try{renderPlanificacion();}catch(e){console.error('renderPlanificacion:',e);}
  try{renderRutinas();}catch(e){console.error('renderRutinas:',e);}
}
if(sessionStorage.getItem('auth')==='1'){enterApp();}
</script>
</body>
</html>
