<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Dashboard — Miguel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#f7f8fa;--bg2:#fff;--bg3:#f0f2f5;--bg4:#e8eaed;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);
  --text:#1a1d23;--text2:#5c6370;--text3:#9aa0ad;
  --blue:#2563eb;--blue-dim:#eff4ff;--blue-bdr:#bfcffe;
  --green:#16a34a;--green-dim:#f0fdf4;--green-bdr:#bbf7d0;
  --amber:#d97706;--amber-dim:#fffbeb;--amber-bdr:#fde68a;
  --coral:#dc2626;--coral-dim:#fef2f2;--coral-bdr:#fecaca;
  --purple:#7c3aed;--purple-dim:#f5f3ff;--purple-bdr:#ddd6fe;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--bg2);border:0.5px solid var(--border2);border-radius:14px;padding:40px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.login-logo{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:8px}
.login-logo::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green)}
.login-title{font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-box input{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:var(--mono);outline:none;transition:border-color .15s}
.login-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.login-box button{width:100%;margin-top:12px;background:var(--blue);border:none;border-radius:var(--radius-sm);padding:10px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:opacity .15s}
.login-box button:hover{opacity:.88}
.login-error{font-size:12px;color:var(--coral);margin-top:8px;display:none}

/* APP */
#app{display:none}
.topbar{background:var(--bg2);border-bottom:0.5px solid var(--border2);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--border)}
.topbar-logo{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.topbar-logo::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)}
.topbar-title{font-size:14px;font-weight:500;color:var(--text);margin-left:14px}
.last-update{font-size:11px;color:var(--text3);font-family:var(--mono)}
.logout-btn{font-size:11px;color:var(--text2);background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;transition:all .15s}
.logout-btn:hover{color:var(--text);background:var(--bg3)}

.main{padding:24px;max-width:1100px;margin:0 auto}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:4px;width:fit-content;box-shadow:var(--shadow);flex-wrap:wrap}
.tab-btn{font-size:13px;padding:7px 16px;background:transparent;border:none;color:var(--text2);cursor:pointer;border-radius:7px;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--blue);color:#fff;font-weight:500}
.tab-btn:hover:not(.active){background:var(--bg3);color:var(--text)}
.tab-content{display:none}.tab-content.active{display:block}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.metric-card{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.metric-card.accent-blue{background:var(--blue-dim);border-color:var(--blue-bdr)}
.metric-card.accent-green{background:var(--green-dim);border-color:var(--green-bdr)}
.metric-card.accent-amber{background:var(--amber-dim);border-color:var(--amber-bdr)}
.metric-card.accent-coral{background:var(--coral-dim);border-color:var(--coral-bdr)}
.metric-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-family:var(--mono)}
.metric-val{font-size:22px;font-weight:600;color:var(--text);font-family:var(--mono)}
.metric-val.blue{color:var(--blue)}.metric-val.green{color:var(--green)}.metric-val.amber{color:var(--amber)}.metric-val.coral{color:var(--coral)}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}

.section-label{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;font-family:var(--mono);margin:28px 0 14px}

/* WEEK GRID */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.day-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;min-height:90px;box-shadow:var(--shadow)}
.day-card.done{border-color:var(--green-bdr);background:var(--green-dim)}
.day-card.modified{border-color:var(--amber-bdr);background:var(--amber-dim)}
.day-card.planned{border-color:var(--border);background:var(--bg2)}
.day-name{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.day-type{font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px}
.day-detail{font-size:11px;color:var(--text2);line-height:1.4}
.day-result{font-size:10px;color:var(--green);margin-top:4px;font-family:var(--mono);font-style:italic}
.day-dot{width:6px;height:6px;border-radius:50%;margin-top:6px}
.day-card { cursor:pointer; }
.day-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:4px; }
.day-expand-icon { font-size:11px; color:var(--text3); flex-shrink:0; margin-top:1px; transition:transform .2s; }
.day-expand-icon.open { transform:rotate(90deg); }
.day-expanded { display:none; margin-top:8px; padding-top:8px; border-top:0.5px solid var(--border); }
.day-expanded.open { display:block; }
.day-detail-full { font-size:11px; color:var(--text2); line-height:1.5; margin-bottom:6px; }
.day-comment { font-size:10px; color:var(--green); font-family:var(--mono); font-style:italic; margin-bottom:4px; }
.day-comment.pending { color:var(--text3); }

.day-card.has-adjust { border-color: var(--amber-bdr); }
.day-adjust-banner { margin-top:6px; background:var(--amber-dim); border:0.5px solid var(--amber-bdr); border-radius:var(--radius-sm); padding:5px 8px; cursor:pointer; transition:background .15s; }
.day-adjust-banner:hover { background:#fef3c7; }
.day-adjust-icon { font-size:11px; }
.day-adjust-text { font-size:10px; color:var(--amber); line-height:1.4; display:block; margin:2px 0; }
.day-adjust-toggle { font-size:10px; color:var(--blue); font-family:var(--mono); }
.day-adjust-detail { display:none; margin-top:6px; }
.day-adjust-detail.open { display:block; }
.adjust-table { width:100%; border-collapse:collapse; font-size:11px; }
.adjust-table th { font-size:10px; color:var(--text3); font-family:var(--mono); text-transform:uppercase; padding:4px 6px; text-align:left; border-bottom:0.5px solid var(--border2); background:var(--bg3); }
.adjust-table td { padding:5px 6px; border-bottom:0.5px solid var(--border); color:var(--text); vertical-align:top; }
.adjust-table tr:last-child td { border-bottom:none; }
.adj-row-del td { color:var(--coral); text-decoration:line-through; opacity:.7; }

.dot-done{background:var(--green)}.dot-modified{background:var(--amber)}.dot-pending{background:var(--text3)}

.load-wrap{margin-bottom:20px}
.load-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;font-family:var(--mono)}
.load-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;border:0.5px solid var(--border)}
.load-fill{height:100%;border-radius:3px;transition:width .4s}
.notes-box{background:var(--bg2);border:0.5px solid var(--border2);border-left:3px solid var(--blue);border-radius:0 var(--radius) var(--radius) 0;padding:14px 18px;font-size:13px;color:var(--text2);line-height:1.6;box-shadow:var(--shadow)}
.alert{background:var(--coral-dim);border:0.5px solid var(--coral-bdr);border-radius:var(--radius);padding:12px 16px;font-size:12px;color:var(--coral);margin-bottom:20px;display:flex;gap:8px;align-items:center}
.chart-card{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:20px;margin-bottom:24px;box-shadow:var(--shadow)}
.chart-card-title{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px}
.chart-wrap{position:relative;width:100%;height:260px}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.race-table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:0.5px solid var(--border2)}
.race-table th{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;text-align:left;border-bottom:0.5px solid var(--border2);background:var(--bg3);font-weight:500}
.race-table td{padding:12px 14px;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
.race-table tr:last-child td{border-bottom:none}
.race-table tr:hover td{background:var(--bg3)}
.race-time{font-family:var(--mono);font-weight:600}
.race-pace{font-family:var(--mono);color:var(--text2);font-size:12px}
.race-name-main{font-weight:500}.race-name-sub{font-size:11px;color:var(--text3);margin-top:1px}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;font-family:var(--mono)}
.badge-best{background:var(--amber-dim);color:var(--amber);border:0.5px solid var(--amber-bdr)}
.badge-pre{background:var(--green-dim);color:var(--green);border:0.5px solid var(--green-bdr)}
.badge-post{background:var(--blue-dim);color:var(--blue);border:0.5px solid var(--blue-bdr)}
.pace-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:4px;width:80px}
.pace-bar-fill{height:100%;border-radius:2px}
.timeline{position:relative;padding-left:20px}
.tl-line{position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--border2)}
.tl-item{position:relative;padding:12px 0 12px 24px;border-bottom:0.5px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-dot{position:absolute;left:-13px;top:17px;width:10px;height:10px;border-radius:50%}
.tl-period{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.tl-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-desc{font-size:12px;color:var(--text2);margin-bottom:6px}
.tl-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono)}
.tag-blue{background:var(--blue-dim);color:var(--blue)}
.tag-green{background:var(--green-dim);color:var(--green)}
.tag-amber{background:var(--amber-dim);color:var(--amber)}
.tag-gray{background:var(--bg3);color:var(--text3)}
.tag-coral{background:var(--coral-dim);color:var(--coral)}
.current-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--blue-dim);color:var(--blue);border:0.5px solid var(--blue-bdr);font-family:var(--mono)}
.status-legend{display:flex;gap:14px;margin-bottom:20px;font-size:11px;color:var(--text3)}
.status-legend span{display:flex;align-items:center;gap:5px}

/* EXPANDABLE BLOCKS — shared by Histórico & Planificación */
.exp-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.exp-filters label{font-size:12px;color:var(--text2)}
.exp-filters input[type=date],.exp-filters select{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;color:var(--text);font-family:var(--sans);outline:none}
.exp-filters input[type=date]:focus,.exp-filters select:focus{border-color:var(--blue)}
.filter-btn{font-size:12px;padding:6px 14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--sans)}
.filter-btn.secondary{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border2)}
.filter-btn.secondary:hover{background:var(--bg3)}

.block-group{margin-bottom:16px;border:0.5px solid var(--border2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.block-header{background:var(--bg2);padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background .15s}
.block-header:hover{background:var(--bg3)}
.block-header-left{display:flex;align-items:center;gap:12px}
.block-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.block-name{font-size:14px;font-weight:500;color:var(--text)}
.block-meta{font-size:12px;color:var(--text3);font-family:var(--mono)}
.block-chevron{font-size:14px;color:var(--text3);transition:transform .2s}
.block-chevron.open{transform:rotate(90deg)}
.block-body{display:none;border-top:0.5px solid var(--border)}
.block-body.open{display:block}

.week-group{border-bottom:0.5px solid var(--border)}
.week-group:last-child{border-bottom:none}
.week-header{padding:12px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--bg3);user-select:none;transition:background .15s}
.week-header:hover{background:var(--bg4)}
.week-header-left{display:flex;align-items:center;gap:10px}
.week-num{font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.week-title{font-size:13px;font-weight:500;color:var(--text)}
.week-obj{font-size:11px;color:var(--text2);margin-top:1px}
.week-chevron{font-size:13px;color:var(--text3);transition:transform .2s}
.week-chevron.open{transform:rotate(90deg)}
.week-body{display:none;padding:16px 18px;background:var(--bg2)}
.week-body.open{display:block}
.week-status-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-family:var(--mono);font-weight:500}
.ws-done{background:var(--green-dim);color:var(--green);border:0.5px solid var(--green-bdr)}
.ws-current{background:var(--blue-dim);color:var(--blue);border:0.5px solid var(--blue-bdr)}
.ws-planned{background:var(--bg3);color:var(--text3);border:0.5px solid var(--border2)}
.no-results{padding:32px;text-align:center;font-size:13px;color:var(--text3)}

@media(max-width:700px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .week-grid{grid-template-columns:repeat(4,1fr)}
  .main{padding:16px}
  .topbar{padding:0 16px}
  .tabs{gap:2px}
  .tab-btn{padding:6px 10px;font-size:12px}
}
@media(max-width:480px){
  .week-grid{grid-template-columns:repeat(2,1fr)}
  .metrics{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">running dashboard</div>
    <div class="login-title">Bienvenido</div>
    <div class="login-sub">Introduce la contraseña para acceder.</div>
    <input type="password" id="pwd-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkLogin()" autofocus/>
    <button onclick="checkLogin()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <div class="topbar-logo">running</div>
      <div class="topbar-title">Miguel · Seguimiento de entrenamiento</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="last-update" id="last-update-label"></span>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="main">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('semana',this)">Estado semanal</button>
      <button class="tab-btn" onclick="showTab('progresion',this)">Progresión</button>
      <button class="tab-btn" onclick="showTab('competiciones',this)">Competiciones</button>
      <button class="tab-btn" onclick="showTab('historico',this)">Histórico</button>
      <button class="tab-btn" onclick="showTab('planificacion',this)">Planificación</button>
    </div>
    <div id="tab-semana" class="tab-content active"></div>
    <div id="tab-progresion" class="tab-content"></div>
    <div id="tab-competiciones" class="tab-content"></div>
    <div id="tab-historico" class="tab-content"></div>
    <div id="tab-planificacion" class="tab-content"></div>
  </div>
</div>

function paceStr(v){const m=Math.floor(v),s=Math.round((v-m)*60);return m+':'+String(s).padStart(2,'0')}
function checkLogin(){
  if(document.getElementById('pwd-input').value===PWD){
    sessionStorage.setItem('auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    initApp();
  }else{
    document.getElementById('login-error').style.display='block';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}
function logout(){sessionStorage.removeItem('auth');document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex';document.getElementById('pwd-input').value=''}
function showTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
}

function initApp(){
  document.getElementById('last-update-label').textContent='Actualizado: '+DATA.lastUpdate;
  renderSemana();
  renderProgresion();
  renderCompeticiones();
  renderHistorico();
  renderPlanificacion();
}

function buildDayCards(days, showResult, ctxId){
  const statusClass={done:'done',modified:'modified',pending:'planned'};
  const dotClass={done:'dot-done',modified:'dot-modified',pending:'dot-pending'};
  return `<div class="week-grid">${days.map((d,di)=>{
    const hasAdjust = d.adjust;
    const adjId = `adj-${ctxId||'w'}-${di}`;
    const expId = `exp-${ctxId||'w'}-${di}`;
    const resultText = d.result || 'Pendiente';
    const resultClass = d.result ? 'day-comment' : 'day-comment pending';
    return `<div class="day-card ${statusClass[d.status]}${hasAdjust?' has-adjust':''}" onclick="toggleDayExpand('${expId}',event)">
      <div class="day-card-header">
        <div>
          <div class="day-name">${d.name}</div>
          <div class="day-type">${d.type}</div>
          <div class="day-detail">${d.detail.length>40?d.detail.substring(0,38)+'…':d.detail}</div>
        </div>
        <span class="day-expand-icon" id="icon-${expId}">›</span>
      </div>
      <div class="day-expanded" id="${expId}" onclick="event.stopPropagation()">
        <div class="day-detail-full">${d.detail}</div>
        ${showResult ? `<div class="${resultClass}"><strong>Estado:</strong> ${resultText}</div>` : ''}
        ${hasAdjust ? `<div class="day-adjust-banner" onclick="toggleAdjust('${adjId}')">
          <span class="day-adjust-icon">⚡</span>
          <span class="day-adjust-text">${d.adjust}</span>
          <span class="day-adjust-toggle" id="tog-${adjId}">ver detalle ›</span>
        </div>
        <div class="day-adjust-detail" id="${adjId}">
          <table class="adjust-table">
            <thead><tr><th>Ejercicio</th><th>Series</th><th>Nota</th></tr></thead>
            <tbody>${d.adjustDetail.map(a=>`<tr class="${a.ejercicio.startsWith('ELIMINAR')?'adj-row-del':''}">
              <td>${a.ejercicio}</td><td style="font-family:var(--mono);white-space:nowrap">${a.series}</td><td>${a.nota}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>` : ''}
      </div>
      <div class="day-dot ${dotClass[d.status]}"></div>
    </div>`;
  }).join('')}</div>`;
}
function toggleDayExpand(id, event){
  if(event) event.stopPropagation();
  const el=document.getElementById(id);
  const icon=document.getElementById('icon-'+id);
  if(!el) return;
  const open=el.classList.toggle('open');
  if(icon) icon.classList.toggle('open', open);
}
function toggleAdjust(id){
  const el=document.getElementById(id);
  const tog=document.getElementById('tog-'+id);
  const open=el.classList.toggle('open');
  tog.textContent=open?'ocultar ‹':'ver detalle ›';
}

function renderSemana(){
  const d=DATA;
  const loadColor=d.weekLoad>85?'#dc2626':d.weekLoad>65?'#d97706':'#16a34a';
  let html='';
  if(!d.dorsalOk)html+=`<div class="alert">⚠ Señal dorsal activa — revisar carga antes de continuar</div>`;
  html+=`<div class="metrics">
    <div class="metric-card accent-blue"><div class="metric-label">Bloque actual</div><div class="metric-val blue" style="font-size:17px">${d.currentBlock}</div><div class="metric-sub">Semana ${d.weekNumber} de 4</div></div>
    <div class="metric-card"><div class="metric-label">Fatiga</div><div class="metric-val ${d.fatigueLevel>=7?'coral':d.fatigueLevel>=5?'amber':'green'}">${d.fatigueLevel}/10</div><div class="metric-sub">${d.fatigueLevel<=4?'baja':d.fatigueLevel<=6?'moderada':'alta'}</div></div>
    <div class="metric-card"><div class="metric-label">Carga semanal</div><div class="metric-val">${d.weekLoad}%</div><div class="metric-sub">del objetivo</div></div>
    <div class="metric-card ${d.dorsalOk?'accent-green':'accent-coral'}"><div class="metric-label">Espalda dorsal</div><div class="metric-val ${d.dorsalOk?'green':'coral'}" style="font-size:17px">${d.dorsalOk?'OK':'Atención'}</div><div class="metric-sub">${d.dorsalStatus}</div></div>
  </div>
  <div class="load-wrap"><div class="load-label"><span>carga acumulada semana</span><span>${d.weekLoad}%</span></div><div class="load-track"><div class="load-fill" style="width:${d.weekLoad}%;background:${loadColor}"></div></div></div>
  <div class="section-label">Semana ${d.weekNumber} — día a día</div>
  ${buildDayCards(d.weekDays, true, 'sw')}
  <div class="status-legend">
    <span><span style="width:6px;height:6px;border-radius:50%;background:#16a34a;display:inline-block"></span>ejecutado</span>
    <span><span style="width:6px;height:6px;border-radius:50%;background:#d97706;display:inline-block"></span>ajustado</span>
    <span><span style="width:6px;height:6px;border-radius:50%;background:#9aa0ad;display:inline-block"></span>pendiente</span>
  </div>`;
  if(d.weekNotes)html+=`<div class="section-label">Notas del entrenador</div><div class="notes-box">${d.weekNotes}</div>`;
  document.getElementById('tab-semana').innerHTML=html;
}

function renderCompeticiones(){
  const d=DATA;
  const best=d.competitions.find(c=>c.phase==='best');
  const lastPre=[...d.competitions].filter(c=>c.phase==='pre').pop();
  const lastPost=[...d.competitions].filter(c=>c.phase==='post').pop();
  const recov=Math.round((best.pace/(lastPost?lastPost.pace:best.pace))*100);
  document.getElementById('tab-competiciones').innerHTML=`
    <div class="metrics">
      <div class="metric-card accent-amber"><div class="metric-label">Mejor marca 10K</div><div class="metric-val amber">${best.time}</div><div class="metric-sub">${best.name} · ${best.date}</div></div>

      <div class="metric-card"><div class="metric-label">Última post-lesión</div><div class="metric-val">${lastPost?lastPost.time:'—'}</div><div class="metric-sub">${lastPost?lastPost.name+' · '+lastPost.date:'—'}</div></div>
      <div class="metric-card accent-green"><div class="metric-label">Recuperación estimada</div><div class="metric-val green">~${recov}%</div><div class="metric-sub">del nivel de mejor marca</div></div>

    </div>
    <div class="section-label">Historial completo</div>
    <table class="race-table">
      <thead><tr><th>Carrera</th><th>Tiempo</th><th>Ritmo</th><th>FC media</th><th>Desnivel</th><th>Fase</th></tr></thead>

function buildExpandableBlocks(blocks, showDoneOnly, filterBlockId){
  const blockTypeColor={current:'#2563eb',planned:'#16a34a',maint:'#9aa0ad',peak:'#d97706',race:'#dc2626'};
  const weekStatusLabel={done:'ejecutada',current:'en curso',planned:'planificada'};
  const weekStatusClass={done:'ws-done',current:'ws-current',planned:'ws-planned'};

  let filtered = blocks;
  if(filterBlockId) filtered = blocks.filter(b=>b.id===filterBlockId);
  if(showDoneOnly) filtered = filtered.map(b=>({...b,weeks:b.weeks.filter(w=>w.status==='done'||w.status==='current')})).filter(b=>b.weeks.length>0);

  if(!filtered.length) return '<div class="no-results">No hay semanas que mostrar con los filtros seleccionados.</div>';

  return filtered.map((block,bi)=>`
    <div class="block-group">
      <div class="block-header" onclick="toggleBlock('bg-${showDoneOnly?'h':'p'}-${bi}')">
        <div class="block-header-left">
          <span class="block-dot" style="background:${blockTypeColor[block.type]||'#9aa0ad'}"></span>
          <span class="block-name">${block.name}</span>
          <span class="block-meta">${block.period}</span>
        </div>
        <span class="block-chevron" id="chev-bg-${showDoneOnly?'h':'p'}-${bi}">›</span>
      </div>
      <div class="block-body" id="bg-${showDoneOnly?'h':'p'}-${bi}">
        ${block.weeks.map((week,wi)=>`
          <div class="week-group">
            <div class="week-header" onclick="toggleWeek('wg-${showDoneOnly?'h':'p'}-${bi}-${wi}')">
              <div class="week-header-left">
                <div>
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="week-title">${week.label}</span>
                    <span class="week-status-badge ${weekStatusClass[week.status]}">${weekStatusLabel[week.status]}</span>
                  </div>
                  <div class="week-obj">${week.dateStart} · <em>${week.objetivo}</em></div>
                </div>
              </div>
              <span class="week-chevron" id="chev-wg-${showDoneOnly?'h':'p'}-${bi}-${wi}">›</span>
            </div>
            <div class="week-body" id="wg-${showDoneOnly?'h':'p'}-${bi}-${wi}">
              ${buildDayCards(week.days, true, `b${bi}w${wi}`)}
              ${week.notes?`<div class="section-label" style="margin-top:12px">Notas del entrenador</div><div class="notes-box">${week.notes}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleBlock(id){
  const body=document.getElementById(id);
  const chev=document.getElementById('chev-'+id);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}
function toggleWeek(id){
  const body=document.getElementById(id);
  const chev=document.getElementById('chev-'+id);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function renderHistorico(){
  const blockOptions = DATA.blocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  let html=`
    <div class="exp-filters">
      <label>Desde</label>
      <input type="date" id="hist-from" />
      <label>Hasta</label>
      <input type="date" id="hist-to" />
      <label>Bloque</label>
      <select id="hist-block"><option value="">Todos los bloques</option>${blockOptions}</select>
      <button class="filter-btn" onclick="applyHistorico()">Filtrar</button>
      <button class="filter-btn secondary" onclick="resetHistorico()">Limpiar</button>
    </div>
    <div id="hist-content">${buildExpandableBlocks(DATA.blocks, true, '')}</div>`;
  document.getElementById('tab-historico').innerHTML=html;
}
function applyHistorico(){
  const blockId=document.getElementById('hist-block').value;
  document.getElementById('hist-content').innerHTML=buildExpandableBlocks(DATA.blocks,true,blockId);
}
function resetHistorico(){
  document.getElementById('hist-block').value='';
  document.getElementById('hist-from').value='';
  document.getElementById('hist-to').value='';
  document.getElementById('hist-content').innerHTML=buildExpandableBlocks(DATA.blocks,true,'');
}

function renderPlanificacion(){
  const blockOptions=DATA.blocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  let html=`
    <div class="exp-filters">
      <label>Bloque</label>
      <select id="plan-block"><option value="">Todos los bloques</option>${blockOptions}</select>
      <button class="filter-btn" onclick="applyPlan()">Filtrar</button>
      <button class="filter-btn secondary" onclick="resetPlan()">Ver todos</button>
    </div>
    <div id="plan-content">${buildExpandableBlocks(DATA.blocks,false,'')}</div>`;
  document.getElementById('tab-planificacion').innerHTML=html;
}
function applyPlan(){
  const blockId=document.getElementById('plan-block').value;
  document.getElementById('plan-content').innerHTML=buildExpandableBlocks(DATA.blocks,false,blockId);
}
function resetPlan(){
  document.getElementById('plan-block').value='';
  document.getElementById('plan-content').innerHTML=buildExpandableBlocks(DATA.blocks,false,'');
}

if(sessionStorage.getItem('auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}
</script>
</body>
</html>
