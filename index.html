      {nombre:`Curl con mancuernas`,peso:`12 kg`,series:`3×10`,descanso:`90"`,descripcion:`De pie o sentado. Agarre supino (palmas hacia arriba). Flexionar el codo subiendo la mancuerna hacia el hombro. Codo fijo — no adelantarlo al subir.`,claves:[`Codo fijo durante todo el movimiento`,`Sin balanceo de tronco para ayudarse`,`El bíceps llega algo prefatigado del jalón — es normal`,`Si no se completan las 3 series a 12kg, bajar a 10kg`],prevencion:`Bíceps como grupo principal. Va antes del hexagonal en el orden de la sesión para que llegue más fresco.`},
      {nombre:`Pallof Press`,peso:`11,5 kg`,series:`3×12 por lado`,descanso:`60"`,descripcion:`De pie lateral a la polea, agarre a la altura del pecho. Empujar hacia adelante y volver. El core resiste la rotación — anti-rotación pura.`,claves:[`No rotar el torso durante el movimiento`,`Brazos extendidos en la posición final 1-2 segundos`,`Pies a la anchura de caderas, posición estable`,`Al final de la sesión si hay espera por la máquina`],prevencion:`Core funcional anti-rotación. Muy específico para la estabilidad en la fase de apoyo de carrera.`},
      {nombre:`Plancha lateral`,peso:`Peso corporal`,series:`3×40s por lado`,descanso:`60"`,descripcion:`Apoyo en antebrazo y borde del pie. Cadera activa — empujar hacia arriba, no dejar que caiga. Cuerpo en línea recta de cabeza a pies.`,claves:[`Cadera activa — no hundida ni elevada`,`Cuerpo en línea recta en todo momento`,`Mirada al frente o ligeramente hacia abajo`,`Si aparece molestia dorsal, reducir el tiempo`],prevencion:`Estabilización lateral de cadera y core. Complementa el Pallof Press para la estabilidad lateral de carrera.`},
      {nombre:`Estiramientos + foam roller dorsal`,peso:`—`,series:`10 min al final`,descanso:`—`,descripcion:`Foam roller dorsal zona media-alta + apertura de cadera (flexor) + estiramiento de gemelo. Obligatorio al final del Gym A por la combinación de press banca y hexagonal.`,claves:[`Foam roller: no rodar sobre la zona lumbar`,`Apertura de cadera: 30-45 seg por lado`,`Gemelo: pie apoyado, talón en el suelo, rodilla extendida`,`No omitir aunque haya prisa`],prevencion:`Descarga activa post-sesión. Previene la tensión acumulada en zona dorsal después del press y el hexagonal.`},
    ]
  },
  {
    id:`gym-b`,
    name:`Gym B — Estabilidad y volumen`,
    icon:`⚡`,
    objetivo:`Cadena posterior corredor + tracción + potencia + prevención dorsal. 70-80 min.`,
    ejercicios:[
      {nombre:`Movilidad torácica`,peso:`—`,series:`8 min al inicio`,descanso:`—`,descripcion:`Foam roller dorsal + rotaciones en cuadrupedia 2x10 + cat-camel 2x12. Obligatorio antes de cargar.`,claves:[`Igual que en Gym A — no saltarse aunque parezca rutina`,`8 minutos reales, no 2 minutos apresurados`],prevencion:`Obligatorio por antecedente dorsal. Reduce la tensión acumulada antes de los swings y el remo.`},
      {nombre:`Kettlebell swing`,peso:`20 kg (Bloque 1) → 24 kg (Bloque 2)`,series:`4×15`,descanso:`90"`,descripcion:`Pies a la anchura de caderas, kettlebell entre los pies. Bisagra de cadera atrás (no sentadilla), explosión de cadera al frente. La KB llega hasta la altura de los hombros por inercia — no levantarla con los brazos.`,claves:[`Bisagra de cadera — no es una sentadilla`,`Explosión de cadera: glúteo y core activos en la parte alta`,`La KB sube por inercia — los brazos no hacen fuerza`,`Espalda neutra durante todo el movimiento`],prevencion:`Ejercicio de potencia de cadena posterior. Fortalece glúteo, isquios y espalda baja — la base de la propulsión en carrera. Solo subir a 24kg cuando el movimiento sea completamente limpio a 20kg.`},
      {nombre:`Step down`,peso:`5 kg/mano`,series:`4×8 por pierna`,descanso:`90"`,descripcion:`De pie en un escalón o step. Bajar una pierna de forma controlada hasta casi tocar el suelo (3 segundos de bajada). La pierna que trabaja es la que queda en el step. Subir empujando con el talón.`,claves:[`Bajada excéntrica de 3 segundos — lenta y controlada`,`Rodilla de la pierna de trabajo no colapsa hacia adentro`,`No usar la pierna que baja para impulsarse`,`Vigilar respuesta de rodilla izquierda (antecedente tendinopatía rotuliana)`],prevencion:`El ejercicio más específico para el tendón rotuliano. El componente excéntrico de la bajada es exactamente el mecanismo que se lesionó — fortalecerlo de forma controlada es la mejor prevención de recaída.`},
      {nombre:`Remo unilateral`,peso:`16 kg (Bloque 1) → 18 kg (Bloque 2)`,series:`4×12 por brazo`,descanso:`90"`,descripcion:`Apoyo con una mano en banco, espalda plana y paralela al suelo. Tirar del codo hacia arriba y atrás. Completar todas las repeticiones de un lado antes de cambiar.`,claves:[`Espalda neutra y paralela al suelo — no torcer para compensar`,`Codo hacia arriba y atrás, no hacia el lado`,`El hombro de la espalda no sube en la parte alta del movimiento`,`Completar un lado antes de cambiar`],prevencion:`Tracción horizontal unilateral. Dorsal + bíceps + retractores escapulares. Clave para la simetría de fuerza entre lado izquierdo y derecho — relevante dado el patrón de equilibrio 51/49.`},
      {nombre:`Press pecho en polea a un brazo`,peso:`10 kg por lado`,series:`4×10 por lado`,descanso:`90"`,descripcion:`De pie lateral a la polea alta, agarre a la altura del pecho. Empujar hacia adelante y ligeramente hacia el centro. Un brazo cada vez. Si hay máquina de pecho disponible → usarla a 45 kg.`,claves:[`Omóplatos retraídos antes de empujar`,`No rotar el torso al empujar`,`Si hay máquina disponible, preferirla — más aislamiento`],prevencion:`Pecho como grupo principal en el Gym B. El bíceps ya trabajó en el remo — el orden está pensado para que cada grupo llegue fresco a su ejercicio de aislamiento.`},
      {nombre:`Farmer carry`,peso:`20 kg (Bloque 1) → 24 kg (Bloque 2)`,series:`4×30m`,descanso:`90"`,descripcion:`Mancuernas o kettlebells en cada mano. Caminar erguido, hombros atrás y abajo, core activo. 30 metros por serie — contar la distancia o usar el tiempo (40 seg aproximado).`,claves:[`Torso erguido — no inclinarse hacia los lados`,`Hombros activos, no dejar que la carga los tire hacia abajo`,`Core activo durante todo el recorrido`,`Pisada controlada — no arrastrar los pies`],prevencion:`Anti-lateral bajo carga. Muy funcional para el corredor — simula la estabilización de cadera y core durante la fase de apoyo. Strava: Caminata del granjero / Paseo del granjero.`},
      {nombre:`Face pull`,peso:`11,5 kg`,series:`4×12`,descanso:`60"`,descripcion:`Polea a la altura de la cara. Tirar hacia la cara con los codos altos, como si fuera a poner las manos detrás de la cabeza. Retracción escapular en la posición final.`,claves:[`Codos altos — a la altura de los hombros o por encima`,`Retracción escapular activa en la parte final`,`No tirar hacia el pecho — hacia la cara`,`Carga ligera que permita hacer el gesto correctamente`],prevencion:`Prioritario para la prevención dorsal. Trabaja el hombro posterior y los retractores escapulares — los músculos que contrarrestan la cifosis torácica del corredor. No omitir nunca.`},
      {nombre:`Tríceps en polea`,peso:`13,5 kg`,series:`3×12`,descanso:`60"`,descripcion:`De pie frente a la polea alta. Codos fijos al lado del cuerpo. Extender los codos hacia abajo hasta bloqueo. Volver de forma controlada.`,claves:[`Codos fijos — no los muevas durante el movimiento`,`Extensión completa en la parte baja`,`Sin balanceo de tronco`,`Va al final — el tríceps ya trabajó en el press pecho`],prevencion:`Aislamiento de tríceps al final de la sesión. En Gym A el tríceps ya trabajó en press banca y press militar — en Gym B llega fresco y este es su ejercicio principal.`},
      {nombre:`Gemelo unilateral`,peso:`Peso corporal`,series:`3×15 por pierna`,descanso:`60"`,descripcion:`De pie, apoyo con una mano para equilibrarse. Subir de puntillas con una sola pierna de forma lenta y controlada. Bajar hasta el suelo sin rebote. Si hay escalón disponible, usarlo para mayor rango.`,claves:[`Subida lenta (2 seg) y bajada muy lenta (3 seg)`,`Sin rebote al llegar abajo`,`Rango completo si hay escalón disponible`,`Completar todas las reps de un lado antes de cambiar`],prevencion:`Prevención del tendón de Aquiles y de la fascia plantar. El trabajo excéntrico lento es el más específico para la prevención de lesiones en la cadena posterior baja del corredor.`},
      {nombre:`Estiramientos + foam roller dorsal`,peso:`—`,series:`8 min al final`,descanso:`—`,descripcion:`Foam roller dorsal zona media-alta + estiramiento de cadena posterior (isquio, cadera) + gemelo. Obligatorio al final del Gym B.`,claves:[`Foam roller: zona dorsal media, no lumbar`,`Isquio: 30-45 seg por lado sin forzar`,`Cadera: flexor del muslo 30-45 seg`,`No omitir — el swing y el step down cargan la cadena posterior intensamente`],prevencion:`Descarga post-sesión. El Gym B trabaja cadena posterior de forma intensa (swing, step down, remo) — la recuperación activa reduce la rigidez y acelera la recuperación.`},
    ]
  },
];


// ── UTILS ──────────────────────────────────────────────────────────────
function paceStr(v){const m=Math.floor(v),s=Math.round((v-m)*60);return m+':'+String(s).padStart(2,'0')}

function checkLogin(){
  if(document.getElementById('pwd-input').value===PWD){
    sessionStorage.setItem('auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    initApp();
  }else{
    document.getElementById('login-error').style.display='block';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}
function logout(){
  sessionStorage.removeItem('auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-input').value='';
}
function showTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
}
function toggleBlock(id){
  const b=document.getElementById(id),c=document.getElementById('chev-'+id);
  b.classList.toggle('open');c.classList.toggle('open');
}
function toggleWeek(id){
  const b=document.getElementById(id),c=document.getElementById('chev-'+id);
  b.classList.toggle('open');c.classList.toggle('open');
}
function toggleDayExpand(id,event){
  if(event)event.stopPropagation();
  const el=document.getElementById(id),icon=document.getElementById('icon-'+id);
  if(!el)return;
  const open=el.classList.toggle('open');
  if(icon)icon.classList.toggle('open',open);
}
function toggleAdjust(id){
  const el=document.getElementById(id),tog=document.getElementById('tog-'+id);
  const open=el.classList.toggle('open');
  if(tog)tog.textContent=open?'ocultar ‹':'ver detalle ›';
}
function toggleRutExercise(id){
  const el=document.getElementById(id),chev=document.getElementById('chev-'+id);
  el.classList.toggle('open');if(chev)chev.classList.toggle('open');
}

// ── DAY CARDS ──────────────────────────────────────────────────────────
function buildDayCards(days,showResult,ctxId){
  const sc={done:'done',modified:'modified',pending:''};
  const dc={done:'dot-done',modified:'dot-modified',pending:'dot-pending'};
  return `<div class="week-grid">${days.map((d,di)=>{
    const hasAdjust=d.adjust;
    const adjId=`adj-${ctxId||'w'}-${di}`;
    const expId=`exp-${ctxId||'w'}-${di}`;
    const resultText=d.result||'Pendiente';
    const resultClass=d.result?'day-comment':'day-comment pending';
    const shortDetail=d.detail.length>42?d.detail.substring(0,40)+'…':d.detail;
    return `<div class="day-card ${sc[d.status]}${hasAdjust?' has-adjust':''}" onclick="toggleDayExpand('${expId}',event)">
      <div class="day-card-header">
        <div>
          <div class="day-name">${d.name}</div>
          <div class="day-type">${d.type}</div>
          <div class="day-detail">${shortDetail}</div>
        </div>
        <span class="day-expand-icon" id="icon-${expId}">›</span>
      </div>
      <div class="day-expanded" id="${expId}" onclick="event.stopPropagation()">
        <div class="day-detail-full">${d.detail}</div>
        ${showResult?`<div class="${resultClass}"><strong>Estado:</strong> ${resultText}</div>`:''}
        ${hasAdjust?`<div class="day-adjust-banner" onclick="toggleAdjust('${adjId}')">
          <span class="day-adjust-text">⚡ ${d.adjust}</span>
          <span class="day-adjust-toggle" id="tog-${adjId}">ver detalle ›</span>
        </div>
        <div class="day-adjust-detail" id="${adjId}">
          <table class="adjust-table">
            <thead><tr><th>Ejercicio</th><th>Series</th><th>Nota</th></tr></thead>
            <tbody>${d.adjustDetail.map(a=>`<tr class="${a.ejercicio.startsWith('ELIMINAR')?'adj-row-del':''}">
              <td>${a.ejercicio}</td><td style="font-family:var(--mono);white-space:nowrap">${a.series}</td><td>${a.nota}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`:''}
      </div>
      <div class="day-dot ${dc[d.status]}"></div>
    </div>`;
  }).join('')}</div>`;
}

// ── SEMANA ─────────────────────────────────────────────────────────────
function renderSemana(){
  const d=DATA;
  const loadColor=d.weekLoad>85?'#dc2626':d.weekLoad>65?'#d97706':'#16a34a';
  let html='';
  html+=`<div class="metrics">
    <div class="metric-card accent-blue"><div class="metric-label">Bloque actual</div><div class="metric-val blue" style="font-size:17px">${d.currentBlock}</div><div class="metric-sub">Semana ${d.weekNumber} de ${d.weekTotal}</div></div>
    <div class="metric-card"><div class="metric-label">Fatiga</div><div class="metric-val ${d.fatigueLevel>=7?'coral':d.fatigueLevel>=5?'amber':'green'}">${d.fatigueLevel}/10</div><div class="metric-sub">${d.fatigueLevel<=4?'baja':d.fatigueLevel<=6?'moderada':'alta'}</div></div>
    <div class="metric-card"><div class="metric-label">Carga semanal</div><div class="metric-val">${d.weekLoad}%</div><div class="metric-sub">del objetivo</div></div>
    <div class="metric-card ${d.dorsalOk?'accent-green':'accent-coral'}"><div class="metric-label">Espalda dorsal</div><div class="metric-val ${d.dorsalOk?'green':'coral'}" style="font-size:17px">${d.dorsalOk?'OK':'Atención'}</div><div class="metric-sub">${d.dorsalStatus}</div></div>
  </div>`;
  html+=`<div class="load-wrap"><div class="load-label"><span>carga acumulada semana</span><span>${d.weekLoad}%</span></div><div class="load-track"><div class="load-fill" style="width:${d.weekLoad}%;background:${loadColor}"></div></div></div>`;
  html+=`<div class="section-label">Semana ${d.weekNumber} — día a día</div>`;
  html+=buildDayCards(d.weekDays,true,'sw');
  html+=`<div class="status-legend">
    <span><span style="width:6px;height:6px;border-radius:50%;background:#16a34a;display:inline-block"></span>ejecutado</span>
    <span><span style="width:6px;height:6px;border-radius:50%;background:#d97706;display:inline-block"></span>ajustado</span>
    <span><span style="width:6px;height:6px;border-radius:50%;background:#9aa0ad;display:inline-block"></span>pendiente</span>
  </div>`;
  if(d.weekNotes)html+=`<div class="section-label">Notas del entrenador</div><div class="notes-box">${d.weekNotes}</div>`;
  document.getElementById('tab-semana').innerHTML=html;
}

// ── COMPETICIONES ──────────────────────────────────────────────────────
function renderCompeticiones(){
  const d=DATA;
  const best=d.competitions.find(c=>c.phase==='best');
  const lastPre=[...d.competitions].filter(c=>c.phase==='pre').pop();
  const lastPost=[...d.competitions].filter(c=>c.phase==='post').pop();
  const recov=Math.round((best.pace/(lastPost?lastPost.pace:best.pace))*100);
  document.getElementById('tab-competiciones').innerHTML=`
    <div class="metrics">
      <div class="metric-card accent-amber"><div class="metric-label">Mejor marca 10K</div><div class="metric-val amber">${best.time}</div><div class="metric-sub">${best.name} · ${best.date}</div></div>
      <div class="metric-card"><div class="metric-label">Última pre-lesión</div><div class="metric-val">${lastPre?lastPre.time:'—'}</div><div class="metric-sub">${lastPre?lastPre.name+' · '+lastPre.date:'—'}</div></div>
      <div class="metric-card"><div class="metric-label">Última post-lesión</div><div class="metric-val">${lastPost?lastPost.time:'—'}</div><div class="metric-sub">${lastPost?lastPost.name+' · '+lastPost.date:'—'}</div></div>
      <div class="metric-card accent-green"><div class="metric-label">Recuperación estimada</div><div class="metric-val green">~${recov}%</div><div class="metric-sub">del nivel de mejor marca</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">ritmo por competición (min/km) — menor es mejor</div>
      <div class="chart-wrap"><canvas id="compChart"></canvas></div>
    </div>
    <div class="section-label">Historial completo</div>
    <table class="race-table">
      <thead><tr><th>Carrera</th><th>Tiempo</th><th>Ritmo</th><th>FC</th><th>Desn.</th><th>Fase</th></tr></thead>
      <tbody>${d.competitions.map(c=>`<tr>
        <td><div class="race-name-main">${c.name}</div><div class="race-name-sub">${c.date} · ${c.dist}</div></td>
        <td><span class="race-time">${c.time}</span></td>
        <td><span class="race-pace">${paceStr(c.pace)}/km</span><div class="pace-bar"><div class="pace-bar-fill" style="width:${Math.round((best.pace/c.pace)*100)}%;background:${c.phase==='best'?'#d97706':c.phase==='post'?'#2563eb':'#16a34a'}"></div></div></td>
        <td>${c.fc?c.fc+' bpm':'—'}</td><td>+${c.desnivel}m</td>
        <td><span class="badge ${c.phase==='best'?'badge-best':c.phase==='post'?'badge-post':'badge-pre'}">${c.phase==='best'?'mejor marca':c.phase==='post'?'post-lesión':'pre-lesión'}</span></td>
      </tr>`).join('')}</tbody>
    </table>`;
  if(window._compChart)window._compChart.destroy();
  window._compChart=new Chart(document.getElementById('compChart'),{
    type:'bar',
    data:{labels:d.competitions.map(c=>c.name.split(' ').slice(0,2).join(' ')+'\n'+c.date),
      datasets:[{label:'Ritmo',data:d.competitions.map(c=>c.pace),
        backgroundColor:d.competitions.map(c=>c.phase==='best'?'rgba(217,119,6,0.7)':c.phase==='post'?'rgba(37,99,235,0.55)':'rgba(22,163,74,0.55)'),
        borderColor:d.competitions.map(c=>c.phase==='best'?'#d97706':c.phase==='post'?'#2563eb':'#16a34a'),
        borderWidth:1.5,borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>'Ritmo: '+paceStr(c.raw)+'/km'}}},
      scales:{y:{reverse:true,min:4.5,max:6.4,grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#9aa0ad',font:{size:11},callback:(v)=>paceStr(v)}},x:{grid:{display:false},ticks:{color:'#9aa0ad',font:{size:10},maxRotation:35,autoSkip:false}}}}
  });
}

// ── EXPANDABLE BLOCKS (shared by Histórico & Planificación) ────────────
function buildExpandableBlocks(blocks,showDoneOnly,filterBlockId,prefix){
  const btc={current:'#2563eb',planned:'#16a34a',maint:'#9aa0ad',peak:'#d97706',race:'#dc2626'};
  const wsl={done:'ejecutada',current:'en curso',planned:'planificada'};
  const wsc={done:'ws-done',current:'ws-current',planned:'ws-planned'};
  let filtered=blocks;
  if(filterBlockId)filtered=blocks.filter(b=>b.id===filterBlockId);
  if(showDoneOnly)filtered=filtered.map(b=>({...b,weeks:b.weeks.filter(w=>w.status==='done'||w.status==='current')})).filter(b=>b.weeks.length>0);
  if(!filtered.length)return '<div class="no-results">No hay semanas que mostrar con los filtros seleccionados.</div>';
  return filtered.map((block,bi)=>`
    <div class="block-group">
      <div class="block-header" onclick="toggleBlock('${prefix}bg${bi}')">
        <div class="block-header-left">
          <span class="block-dot" style="background:${btc[block.type]||'#9aa0ad'}"></span>
          <span class="block-name">${block.name}</span>
          <span class="block-meta">${block.period}</span>
        </div>
        <span class="block-chevron" id="chev-${prefix}bg${bi}">›</span>
      </div>
      <div class="block-body" id="${prefix}bg${bi}">
        ${block.weeks.map((week,wi)=>`
          <div class="week-group">
            <div class="week-header" onclick="toggleWeek('${prefix}wg${bi}-${wi}')">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="week-title">${week.label}</span>
                  <span class="week-status-badge ${wsc[week.status]}">${wsl[week.status]}</span>
                </div>
                <div class="week-obj">${week.dateStart} · <em>${week.objetivo}</em></div>
              </div>
              <span class="week-chevron" id="chev-${prefix}wg${bi}-${wi}">›</span>
            </div>
            <div class="week-body" id="${prefix}wg${bi}-${wi}">
              ${buildDayCards(week.days,true,`${prefix}b${bi}w${wi}`)}
              ${week.notes?`<div class="section-label" style="margin-top:12px">Notas del entrenador</div><div class="notes-box">${week.notes}</div>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// ── HISTÓRICO ──────────────────────────────────────────────────────────
function renderHistorico(){
  const histBlocks=DATA.blocks.filter(b=>b.id==='b1');
  const opts=histBlocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('tab-historico').innerHTML=`
    <div class="exp-filters">
      <label>Bloque</label>
      <select id="hist-block"><option value="">Todos los bloques</option>${opts}</select>
      <button class="filter-btn" onclick="applyHistorico()">Filtrar</button>
      <button class="filter-btn secondary" onclick="resetHistorico()">Limpiar</button>
    </div>
    <div id="hist-content">${buildExpandableBlocks(histBlocks,false,'','h')}</div>`;
}
function applyHistorico(){document.getElementById('hist-content').innerHTML=buildExpandableBlocks(DATA.blocks,true,document.getElementById('hist-block').value,'h')}
function resetHistorico(){document.getElementById('hist-block').value='';document.getElementById('hist-content').innerHTML=buildExpandableBlocks(DATA.blocks,true,'','h')}

// ── PLANIFICACIÓN ──────────────────────────────────────────────────────
function renderPlanificacion(){
  const planBlocks=DATA.blocks.filter(b=>b.id!=='b1');
  const opts=planBlocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  document.getElementById('tab-planificacion').innerHTML=`
    <div class="exp-filters">
      <label>Bloque</label>
      <select id="plan-block"><option value="">Todos los bloques</option>${opts}</select>
      <button class="filter-btn" onclick="applyPlan()">Filtrar</button>
      <button class="filter-btn secondary" onclick="resetPlan()">Ver todos</button>
    </div>
    <div id="plan-content">${buildExpandableBlocks(planBlocks,false,'','p')}</div>`;
}
function applyPlan(){const planBlocks=DATA.blocks.filter(b=>b.id!=='b1');document.getElementById('plan-content').innerHTML=buildExpandableBlocks(planBlocks,false,document.getElementById('plan-block').value,'p')}
function resetPlan(){const planBlocks=DATA.blocks.filter(b=>b.id!=='b1');document.getElementById('plan-block').value='';document.getElementById('plan-content').innerHTML=buildExpandableBlocks(planBlocks,false,'','p')}

// ── RUTINAS ────────────────────────────────────────────────────────────
function renderRutinas(){
  let html='';
  RUTINAS.forEach((rutina,ri)=>{
    html+=`<div class="block-group">
      <div class="block-header" onclick="toggleBlock('rut${ri}')">
        <div class="block-header-left">
          <span style="font-size:18px;line-height:1">${rutina.icon}</span>
          <span class="block-name">${rutina.name}</span>
        </div>
        <span class="block-chevron" id="chev-rut${ri}">›</span>
      </div>
      <div class="block-body" id="rut${ri}">
        <div style="padding:10px 18px;font-size:12px;color:var(--text2);border-bottom:0.5px solid var(--border);font-style:italic">${rutina.objetivo}</div>
        ${rutina.ejercicios.map((ej,ei)=>`
          <div>
            <div class="rut-exercise-row" onclick="toggleRutExercise('rutex${ri}-${ei}')">
              <div style="display:flex;align-items:center;gap:14px;flex:1">
                <span style="font-size:13px;font-weight:500">${ej.nombre}</span>
                <span style="font-size:11px;font-family:var(--mono);color:var(--text3)">${ej.series}</span>
                ${ej.peso!=='—'?`<span style="font-size:11px;font-family:var(--mono);color:var(--text3)">${ej.peso}</span>`:''}
                ${ej.descanso!=='—'?`<span style="font-size:11px;font-family:var(--mono);color:var(--blue);background:var(--blue-dim);padding:1px 7px;border-radius:4px">desc ${ej.descanso}</span>`:''}
              </div>
              <span class="week-chevron" id="chev-rutex${ri}-${ei}">›</span>
            </div>
            <div class="rut-exercise-body" id="rutex${ri}-${ei}">
              <p style="font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:14px">${ej.descripcion}</p>
              <div style="margin-bottom:12px">
                <div style="font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:8px">Claves de ejecución</div>
                <ul class="rut-key-list">${ej.claves.map(c=>`<li><span style="color:var(--green);font-size:14px;flex-shrink:0">›</span>${c}</li>`).join('')}</ul>
              </div>
              <div class="rut-prevention"><strong>Para el running:</strong> ${ej.prevencion}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('tab-rutinas').innerHTML=html;
}

// ── INIT ───────────────────────────────────────────────────────────────
function initApp(){
  document.getElementById('last-update-label').textContent='Actualizado: '+DATA.lastUpdate;
  try{renderSemana();}catch(e){console.error('renderSemana:',e);}
  try{renderProgresion();}catch(e){console.error('renderProgresion:',e);}
  try{renderCompeticiones();}catch(e){console.error('renderCompeticiones:',e);}
  try{renderHistorico();}catch(e){console.error('renderHistorico:',e);document.getElementById('tab-historico').innerHTML='<div style="padding:20px;color:red">Error: '+e.message+'</div>';}
  try{renderPlanificacion();}catch(e){console.error('renderPlanificacion:',e);document.getElementById('tab-planificacion').innerHTML='<div style="padding:20px;color:red">Error: '+e.message+'</div>';}
  try{renderRutinas();}catch(e){console.error('renderRutinas:',e);document.getElementById('tab-rutinas').innerHTML='<div style="padding:20px;color:red">Error: '+e.message+'</div>';}
}

if(sessionStorage.getItem('auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}
</script>
